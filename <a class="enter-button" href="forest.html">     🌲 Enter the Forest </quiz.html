<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>The Realm of Westeros 🐉</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            font-family: Georgia, serif;

            background:
                radial-gradient(
                    circle at top,
                    #46352f,
                    #1c241d 65%,
                    #101710
                );

            color: #f3ead2;

            padding: 40px 20px;
        }

        .container {
            max-width: 800px;

            margin: auto;

            text-align: center;
        }

        .dragon {
            font-size: 65px;

            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {

            0%, 100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-8px);
            }

        }

        h1 {
            font-size: clamp(38px, 7vw, 65px);

            margin: 15px 0 5px;

            color: #e7ce86;
        }

        .subtitle {
            font-style: italic;

            color: #c8c0a7;

            margin-bottom: 40px;
        }

        .question {

            background: #f3ead7;

            color: #263628;

            border: 2px solid #c6a85b;

            border-radius: 20px;

            padding: 30px;

            margin: 25px 0;

            text-align: left;

            box-shadow: 0 12px 30px rgba(0,0,0,0.3);
        }

        .question h2 {

            margin-top: 0;

            font-size: 20px;

        }

        .answers {

            display: grid;

            gap: 10px;

            margin-top: 20px;

        }

        .answer {

            padding: 13px 16px;

            border-radius: 12px;

            border: 1px solid #9d8b58;

            background: #fffaf0;

            font-family: Georgia, serif;

            font-size: 16px;

            cursor: pointer;

            text-align: left;

            transition: 0.2s;

        }

        .answer:hover {

            transform: translateX(5px);

            background: #e8dfc5;

        }

        .answer.correct {

            background: #b9d4b5;

        }

        .answer.wrong {

            background: #d9aaa4;

        }

        .result {

            display: none;

            background: #f3ead7;

            color: #263628;

            border-radius: 20px;

            padding: 35px;

            margin-top: 35px;

            border: 2px solid #c6a85b;

        }

        .result h2 {

            color: #214a32;

            font-size: 32px;

        }

        .back {

            display: inline-block;

            margin-top: 30px;

            padding: 13px 25px;

            border-radius: 30px;

            background: #c6a85b;

            color: #17291d;

            text-decoration: none;

            font-weight: bold;

        }

    </style>

</head>


<body>

<div class="container">

    <div class="dragon">
        🐉
    </div>

    <h1>
        The Realm of Westeros
    </h1>

    <p class="subtitle">
        How well do you know Game of Thrones?
    </p>


    <!-- Question 1 -->

    <div class="question">

        <h2>
            1. What is the name of Jon Snow's direwolf?
        </h2>

        <div class="answers">

            <button class="answer"
                    onclick="answer(this, false)">
                Grey Wind
            </button>

            <button class="answer"
                    onclick="answer(this, true)">
                Ghost
            </button>

            <button class="answer"
                    onclick="answer(this, false)">
                Nymeria
            </button>

            <button class="answer"
                    onclick="answer(this, false)">
                Summer
            </button>

        </div>

    </div>


    <!-- Question 2 -->

    <div class="question">

        <h2>
            2. What is the name of Arya Stark's sword?
        </h2>

        <div class="answers">

            <button class="answer"
                    onclick="answer(this, false)">
                Longclaw
            </button>

            <button class="answer"
                    onclick="answer(this, false)">
                Heartsbane
            </button>

            <button class="answer"
                    onclick="answer(this, true)">
                Needle
            </button>

            <button class="answer"
                    onclick="answer(this, false)">
                Ice
            </button>

        </div>

    </div>


    <!-- Question 3 -->

    <div class="question">

        <h2>
            3. What is the capital of the Seven Kingdoms?
        </h2>

        <div class="answers">

            <button class="answer"
                    onclick="answer(this, true)">
                King's Landing
            </button>

            <button class="answer"
                    onclick="answer(this, false)">
                Winterfell
            </button>

            <button class="answer"
                    onclick="answer(this, false)">
                Dragonstone
            </button>

            <button class="answer"
                    onclick="answer(this, false)">
                The Eyrie
            </button>

        </div>

    </div>


    <!-- Question 4 -->

    <div class="question">

        <h2>
            4. Which house is associated with the motto
            "Winter is Coming"?
        </h2>

        <div class="answers">

            <button class="answer"
                    onclick="answer(this, false)">
                House Lannister
            </button>

            <button class="answer"
                    onclick="answer(this, true)">
                House Stark
            </button>

            <button class="answer"
                    onclick="answer(this, false)">
                House Targaryen
            </button>

            <button class="answer"
                    onclick="answer(this, false)">
                House Tyrell
            </button>

        </div>

    </div>


    <!-- Result -->

    <div class="result" id="result">

        <h2 id="resultTitle"></h2>

        <p id="resultText"></p>

        <a class="back"
           href="forest.html">
            🌲 Return to the Forest
        </a>

    </div>

</div>


<script>

    let score = 0;

    let answered = 0;

    const totalQuestions = 4;


    function answer(button, correct) {

        const question =
            button.closest(".question");

        const buttons =
            question.querySelectorAll(".answer");


        if (question.dataset.answered) {
            return;
        }


        question.dataset.answered = "true";

        answered++;


        if (correct) {

            button.classList.add("correct");

            score++;

        } else {

            button.classList.add("wrong");

        }


        buttons.forEach(function(btn) {

            btn.disabled = true;

        });


        if (answered === totalQuestions) {

            showResult();

        }

    }


    function showResult() {

        const result =
            document.getElementById("result");

        const title =
            document.getElementById("resultTitle");

        const text =
            document.getElementById("resultText");


        result.style.display = "block";


        if (score === 4) {

            title.innerHTML =
                "👑 The King of Westeros!";

            text.innerHTML =
                "Perfect score. You clearly know your Westeros.";

        }

        else if (score >= 2) {

            title.innerHTML =
                "🐺 A Worthy Stark";

            text.innerHTML =
                "Not bad, Stink. You may survive another winter.";

        }

        else {

            title.innerHTML =
                "🐌 You Know Nothing, Stink";

            text.innerHTML =
                "Perhaps the Maester needs to give you a few lessons.";

        }

    }

</script>


</body>

</html>
