<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Mystery Trail 🐾</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    font-family: Georgia, serif;
    color: #eee9d8;

    background:
        radial-gradient(
            circle at top,
            #294b38 0%,
            #132b20 45%,
            #07150f 100%
        );

    display: flex;
    justify-content: center;
    align-items: center;
    padding: 25px 15px;
}

#game {
    position: relative;
    width: min(900px, 100%);
    min-height: 650px;

    overflow: hidden;

    border: 3px solid #607b55;
    border-radius: 30px;

    box-shadow:
        0 15px 45px rgba(0,0,0,.45);

    background: #132b20;
}

#background {
    position: absolute;
    inset: 0;
    z-index: 0;
    pointer-events: none;

    transition: background .5s ease;
}

#background::before {
    content: "";
    position: absolute;
    inset: 0;

    background:
        radial-gradient(circle at 15% 20%,
            rgba(255,255,255,.08) 0 2px,
            transparent 3px),

        radial-gradient(circle at 75% 30%,
            rgba(255,255,255,.06) 0 2px,
            transparent 3px),

        radial-gradient(circle at 45% 75%,
            rgba(255,255,255,.05) 0 2px,
            transparent 3px);

    background-size:
        150px 130px,
        210px 170px,
        190px 160px;
}

.scene-dawn {
    background:
        linear-gradient(
            to bottom,
            #294f63 0%,
            #6e8d83 52%,
            #324c34 100%
        );
}

.scene-bedroom {
    background:
        radial-gradient(
            circle at 50% 25%,
            #7d6b56 0%,
            #433b34 35%,
            #171916 100%
        );
}

.scene-cottage {
    background:
        linear-gradient(
            to bottom,
            #536c58 0%,
            #273d2b 55%,
            #101d14 100%
        );
}

.scene-path {
    background:
        linear-gradient(
            to bottom,
            #31556a 0%,
            #294837 50%,
            #101d14 100%
        );
}

.scene-deep {
    background:
        radial-gradient(
            circle at 50% 35%,
            #31543e 0%,
            #12271b 55%,
            #06100a 100%
        );
}

.scene-flower {
    background:
        radial-gradient(
            circle at 50% 25%,
            #71634e 0%,
            #304a35 48%,
            #101a12 100%
        );
}

.scene-witch {
    background:
        radial-gradient(
            circle at 50% 25%,
            #66526e 0%,
            #30253d 45%,
            #111018 100%
        );
}

.scene-swamp {
    background:
        radial-gradient(
            circle at 60% 30%,
            #52643a 0%,
            #27351e 45%,
            #10170d 100%
        );
}

#content {
    position: relative;
    z-index: 10;

    min-height: 650px;

    padding: 45px 35px;

    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
}

.chapter {
    margin-bottom: 10px;

    color: #b8c99d;

    font-size: 14px;
    letter-spacing: 2px;
    text-transform: uppercase;
}

.icon {
    font-size: 75px;
    margin-bottom: 10px;

h1 {
    margin: 0 0 15px;

    text-align: center;

    color: #e3d39a;

    font-size:
        clamp(30px, 6vw, 52px);
}

h2 {
    margin: 0 0 20px;

    color: #d5c38c;

    font-size: 28px;
    text-align: center;
}

.story {
    width: min(680px, 100%);

    margin:
        0 auto 30px;

    font-size: 18px;
    line-height: 1.75;

    text-align: center;

    color: #eee9d8;
}

.choices {
    width: min(650px, 100%);

    display: flex;
    flex-direction: column;

    gap: 13px;
}

.choice {
    position: relative;
    z-index: 20;

    pointer-events: auto;

    width: 100%;

    padding: 16px 20px;

    border:
        2px solid #6c825c;

    border-radius: 16px;

    background:
        rgba(25,43,31,.92);

    color: #f0ead8;

    font-family: Georgia, serif;
    font-size: 17px;
    line-height: 1.4;

    cursor: pointer;

.choice:hover {
    transform: translateY(-2px);

    background:

    border-color: #a5b87e;
}

.choice:active {
    transform: translateY(0);
}

.ending {
    width: min(650px, 100%);

    text-align: center;
}

.ending .bigIcon {
    font-size: 90px;
    margin-bottom: 15px;
}

.ending h1 {
    font-size:
        clamp(28px, 6vw, 48px);
}

.ending button {
    position: relative;
    z-index: 20;

    margin-top: 20px;

    padding: 13px 26px;

    border: none;
    border-radius: 25px;

    background: #d2b86c;

    color: #20291e;

    font-family: Georgia, serif;
    font-weight: bold;
    font-size: 16px;

    cursor: pointer;

    padding: 20px;

    border:
        2px solid #657d59;

    border-radius: 18px;

    background:
        rgba(13,25,17,.65);

    color: #e1cf8b;
    font-size: 24px;
}

.back {
    position: fixed;

    bottom: 15px;
    left: 15px;

    z-index: 100;

    color: #cbd6b5;

    text-decoration: none;

    font-size: 14px;
}

.back:hover {
    color: white;
}

    body {
        padding: 10px;
        align-items: flex-start;
    }

    #game {
        min-height:
            calc(100vh - 20px);
    }

    #content {
        min-height:
            calc(100vh - 20px);

        padding:

    }

    .icon {
        font-size: 60px;
    }

    .story {
        font-size: 16px;
        line-height: 1.65;
    }

    .choice {
        font-size: 15px;
        padding: 14px 15px;
    }
}
</style>
</head>

   TRAVELER TRAITS
   ========================================================= */

let traits = {
    brave: 0,
    kind: 0,
    clever: 0,
    curious: 0,
    chaotic: 0,
    cozy: 0
};


function addTrait(trait) {

    if (
        trait &&
        Object.prototype.hasOwnProperty.call(traits, trait)
    ) {
        traits[trait]++;
    }
}

/* =========================================================
   TRAVELER TYPE
   ========================================================= */

function getTravelerType() {

    const entries =
        Object.entries(traits);

    entries.sort(function(a, b) {
        return b[1] - a[1];
    });

    const top =
        entries[0][0];

    const types = {

        brave: {
            name: "The Fearless Wanderer",
            text:
                "You charge into strange situations with impressive confidence."
        },

        kind: {
            name: "The Gentle Forest Friend",
            text:
                "You lead with kindness, even when the forest gets weird."
        },

        clever: {
            name: "The Clever Pathfinder",
            text:
                "You prefer a smart solution over a dramatic one."
        },

        curious: {
            name: "The Curious Explorer",
            text:
                "You cannot resist investigating whatever looks mysterious."
        },

        chaotic: {
            name: "The Chaotic Little Creature",
            text:
                "You somehow turn every simple decision into an adventure."
        },

        cozy: {
            name: "The Cozy Wanderer",
            text:
                "You believe every adventure should include rest, snacks and somewhere comfortable to sit."
        }

    };

    return types[top];
}


/* =========================================================
   RESTART
   ========================================================= */

function restartGame() {

    traits = {
        brave: 0,
        kind: 0,
        clever: 0,
        curious: 0,
        chaotic: 0,
        cozy: 0
    };

    showScene("start");
}


/* =========================================================
   SHOW ENDING
   ========================================================= */

function showEnding(scene) {

    const traveler =
        getTravelerType();

    content.innerHTML = `

        <div class="ending">

            <div class="bigIcon">
                ${scene.icon}
            </div>

            <div class="chapter">
                Your Ending
            </div>

            <h1>
                ${scene.title}
            </h1>

            <div class="story">
                ${scene.text}
            </div>

            <div id="travelerResult">

                <strong>
                    ${traveler.name}
                </strong>

                <br><br>

                ${traveler.text}

            </div>

            <button
                id="restartButton"
                type="button"
            >
                🌲 Start the Mystery Trail Again
            </button>

        </div>

    `;

    document
        .getElementById("restartButton")
        .addEventListener(
            "click",
            restartGame
        );
}


/* =========================================================
   SHOW SCENE
   ========================================================= */

function showScene(sceneId) {

    const scene =
        scenes[sceneId];

    if (!scene) {

        console.error(
            "Scene not found:",
            sceneId
        );

        return;
    }

    background.className =
        scene.background;

    if (scene.ending) {

        showEnding(scene);

        return;
    }

    content.innerHTML = `

        <div class="chapter">
            ${scene.chapter}
        </div>

        <div class="icon">
            ${scene.icon}
        </div>

        <h2>
            ${scene.title}
        </h2>

        <div class="story">
            ${scene.text}
        </div>

        <div
            class="choices"
            id="choices"
        ></div>

    `;

    const choicesContainer =
        document.getElementById("choices");


    scene.choices.forEach(function(choice) {

        const button =
            document.createElement("button");

        button.className =
            "choice";

        button.type =
            "button";

        button.textContent =
            choice.text;


        button.addEventListener(
            "click",
            function() {

                addTrait(choice.trait);

                showScene(
                    choice.next
                );

            }
        );


        choicesContainer.appendChild(
            button
        );

    });
}


/* =========================================================
   START
   ========================================================= */

showScene("start");

<script>
/* =========================================================
   MYSTERY TRAIL UPGRADE ENGINE
   ========================================================= */

(function () {

    const SAVE_KEY = "mysteryTrailUpgradeSave";

    const content = document.getElementById("content");

    const titleScreen =
        document.getElementById("upgradeTitleScreen");

    const newGameButton =
        document.getElementById("upgradeNewGame");

    const continueButton =
        document.getElementById("upgradeContinue");

    const backButton =
        document.getElementById("upgradeBack");

    const saveButton =
        document.getElementById("upgradeSave");

    const traitButton =
        document.getElementById("upgradeTraitButton");

    const bagButton =
        document.getElementById("upgradeBagButton");

    const traitPanel =
        document.getElementById("upgradeTraits");

    const bagPanel =
        document.getElementById("upgradeBag");

    const progressFill =
        document.getElementById("upgradeProgressFill");

    const progressText =
        document.getElementById("upgradeProgressText");

    const toast =
        document.getElementById("upgradeToast");

    let sceneHistory = [];

    let discoveredScenes = new Set();

    let inventory = {
        note: false,
        map: false,
        coffee: false,
        biscuit: false,
        bell: false,
        flower: false,
        hat: false
    };

    let choicesMade = 0;

    let traitCounts = {
        brave: 0,
        kind: 0,
        clever: 0,
        curious: 0,
        chaotic: 0,
        cozy: 0
    };


    /* -----------------------------------------------------
       TOAST
       ----------------------------------------------------- */

    function showToast(message) {

        toast.textContent = message;

        toast.classList.add("show");

        clearTimeout(showToast.timer);

        showToast.timer =
            setTimeout(function () {
                toast.classList.remove("show");
            }, 1600);
    }


    /* -----------------------------------------------------
       SAVE
       ----------------------------------------------------- */

    function save() {

        try {

            const data = {
                history: sceneHistory,
                discovered:
                    Array.from(discoveredScenes),
                inventory: inventory,
                choicesMade: choicesMade,
                traits: traitCounts
            };

            localStorage.setItem(
                SAVE_KEY,
                JSON.stringify(data)
            );

            updateContinueButton();

            showToast("Adventure saved ✓");

        } catch (error) {

            console.warn(
                "Mystery Trail save failed:",
                error
            );

        }
    }


    function silentSave() {

        try {

            const data = {
                history: sceneHistory,
                discovered:
                    Array.from(discoveredScenes),
                inventory: inventory,
                choicesMade: choicesMade,
                traits: traitCounts
            };

            localStorage.setItem(
                SAVE_KEY,
                JSON.stringify(data)
            );

        } catch (error) {}
    }


    /* -----------------------------------------------------
       LOAD
       ----------------------------------------------------- */

    function loadSave() {

        try {

            const raw =
                localStorage.getItem(SAVE_KEY);

            if (!raw) return false;

            const data =
                JSON.parse(raw);

            sceneHistory =
                Array.isArray(data.history)
                    ? data.history
                    : [];

            discoveredScenes =
                new Set(
                    Array.isArray(data.discovered)
                        ? data.discovered
                        : []
                );

            if (data.inventory) {

                Object.keys(inventory).forEach(function (key) {

                    inventory[key] =
                        Boolean(data.inventory[key]);

                });

            }

            choicesMade =
                Number(data.choicesMade) || 0;

            if (data.traits) {

                Object.keys(traitCounts).forEach(function (key) {

                    traitCounts[key] =
                        Number(data.traits[key]) || 0;

                });

            }

            updateInventory();

            updateTraits();

            updateProgress();

            return true;

        } catch (error) {

            console.warn(
                "Mystery Trail load failed:",
                error
            );

            return false;
        }
    }


    /* -----------------------------------------------------
       CONTINUE BUTTON
       ----------------------------------------------------- */

    function updateContinueButton() {

        const exists =
            Boolean(localStorage.getItem(SAVE_KEY));

        continueButton.style.display =
            exists
                ? "inline-block"
                : "none";
    }


    /* -----------------------------------------------------
       TRAITS
       ----------------------------------------------------- */

    function recordTrait(trait) {

        if (
            trait &&
            Object.prototype.hasOwnProperty.call(
                traitCounts,
                trait
            )
        ) {

            traitCounts[trait]++;

            updateTraits();
        }
    }


    function getPersonality() {

        let best = "cozy";

        Object.keys(traitCounts).forEach(function (trait) {

            if (
                traitCounts[trait] >
                traitCounts[best]
            ) {

                best = trait;

            }

        });

        const personalities = {

            brave: [
                "💪 The Fearless Wanderer",
                "You charge into strange situations with impressive confidence."
            ],

            kind: [
                "💚 The Gentle Forest Friend",
                "You lead with kindness, even when the forest gets weird."
            ],

            clever: [
                "🧠 The Clever Pathfinder",
                "You prefer a smart solution over a dramatic one."
            ],

            curious: [
                "👀 The Curious Explorer",
                "You cannot resist investigating whatever looks mysterious."
            ],

            chaotic: [
                "😈 The Chaotic Little Creature",
                "You somehow turn every simple decision into an adventure."
            ],

            cozy: [
                "🛏️ The Cozy Wanderer",
                "You believe every adventure should include rest, snacks and somewhere comfortable to sit."
            ]

        };

        return personalities[best];
    }


    function updateTraits() {

        const result =
            getPersonality();

        let html =
            "<strong>" +
            result[0] +
            "</strong>" +
            "<br><br>" +
            result[1] +
            "<br><br>";

        Object.keys(traitCounts).forEach(function (trait) {

            html +=
                "<small>" +
                trait.charAt(0).toUpperCase() +
                trait.slice(1) +
                ": " +
                traitCounts[trait] +
                "</small><br>";

        });

        document.getElementById(
            "upgradeTraitResult"
        ).innerHTML = html;
    }


    /* -----------------------------------------------------
       INVENTORY
       ----------------------------------------------------- */

    function updateInventory() {

        Object.keys(inventory).forEach(function (item) {

            const element =
                document.querySelector(
                    '[data-upgrade-item="' +
                    item +
                    '"]'
                );

            if (!element) return;

            element.classList.toggle(
                "missing",
                !inventory[item]
            );

        });

    }


    function detectInventory(text) {

        const lower =
            text.toLowerCase();

        if (
            lower.includes(
                "folded note"
            ) ||
            lower.includes(
                "mysterious note"
            )
        ) {

            inventory.note = true;

        }

        if (
            lower.includes(
                "hand-drawn map"
            )
        ) {

            inventory.map = true;

        }

        if (
            lower.includes(
                "tiny cup"
            ) ||
            lower.includes(
                "cup of coffee"
            )
        ) {

            inventory.coffee = true;

        }

        if (
            lower.includes(
                "hands you a small biscuit"
            ) ||
            lower.includes(
                "hand you one"
            ) ||
            lower.includes(
                "the biscuit"
            )
        ) {

            /*
             * Only visually track the biscuit when
             * the player has reached a biscuit-related
             * scene. This does not alter the story.
             */

            if (
                lower.includes(
                    "biscuit"
                )
            ) {

                inventory.biscuit = true;

            }

        }

        if (
            lower.includes(
                "tiny bell"
            )
        ) {

            inventory.bell = true;

        }

        if (
            lower.includes(
                "magical flower"
            )
        ) {

            /*
             * This is deliberately conservative:
             * the flower becomes an inventory item once
             * the scene is actually about receiving it.
             */

            if (
                lower.includes(
                    "gives you the magical flower"
                ) ||
                lower.includes(
                    "gives you the flower"
                ) ||
                lower.includes(
                    "hand her the magical flower"
                )
            ) {

                inventory.flower = true;

            }

        }

        if (
            lower.includes(
                "tiny hat"
            ) &&
            (
                lower.includes(
                    "places it carefully"
                ) ||
                lower.includes(
                    "leave the forest wearing"
                )
            )
        ) {

            inventory.hat = true;

        }

        updateInventory();
    }


    /* -----------------------------------------------------
       PROGRESS
       ----------------------------------------------------- */

    function updateProgress() {

        const count =
            discoveredScenes.size;

        /*
         * We do not pretend the story is linear.
         * Instead, progress measures how much of the
         * discovered adventure the player has explored.
         */

        const percent =
            Math.min(
                100,
                Math.round(
                    Math.min(
                        count / 45,
                        1
                    ) * 100
                )
            );

        progressFill.style.width =
            percent + "%";

        progressText.textContent =
            "Trail explored • " +
            count +
            " scene" +
            (count === 1 ? "" : "s") +
            " discovered • " +
            percent +
            "%";

        backButton.disabled =
            sceneHistory.length === 0;
    }


    /* -----------------------------------------------------
       PANELS
       ----------------------------------------------------- */

    function closePanels() {

        traitPanel.classList.remove("open");

        bagPanel.classList.remove("open");

    }


    traitButton.addEventListener(
        "click",
        function () {

            bagPanel.classList.remove("open");

            traitPanel.classList.toggle("open");

        }
    );


    bagButton.addEventListener(
        "click",
        function () {

            traitPanel.classList.remove("open");

            bagPanel.classList.toggle("open");

        }
    );


    document.addEventListener(
        "click",
        function (event) {

            if (
                !traitPanel.contains(event.target) &&
                !traitButton.contains(event.target)
            ) {

                traitPanel.classList.remove("open");

            }

            if (
                !bagPanel.contains(event.target) &&
                !bagButton.contains(event.target)
            ) {

                bagPanel.classList.remove("open");

            }

        }
    );


    /* -----------------------------------------------------
       SCENE ANIMATION
       ----------------------------------------------------- */

    function animateScene() {

        if (!content) return;

        content.classList.remove(
            "upgrade-scene-in"
        );

        void content.offsetWidth;

        content.classList.add(
            "upgrade-scene-in"
        );

    }


    /* -----------------------------------------------------
       WATCH THE ORIGINAL GAME
       ----------------------------------------------------- */

    let previousHTML = "";

    const observer =
        new MutationObserver(
            function () {

                if (!content) return;

                const html =
                    content.innerHTML;

                if (
                    html &&
                    html !== previousHTML
                ) {

                    previousHTML = html;

                    animateScene();

                    discoveredScenes.add(
                        html.slice(0, 80)
                    );

                    /*
                     * Look at the currently displayed
                     * story text and automatically detect
                     * useful items.
                     */

                    detectInventory(
                        content.innerText
                    );

                    updateProgress();

                }

            }
        );

    observer.observe(
        content,
        {
            childList: true,
            subtree: true
        }
    );


    /* -----------------------------------------------------
       CHOICE TRACKING
       ----------------------------------------------------- */

    document.addEventListener(
        "click",
        function (event) {

            const button =
                event.target.closest(
                    ".choice, .choices button"
                );

            if (!button) return;

            choicesMade++;

            const text =
                button.textContent.toLowerCase();

            /*
             * Track personality without touching
             * the original game's trait system.
             */

            if (
                text.includes("brav") ||
                text.includes("run") ||
                text.includes("confident") ||
                text.includes("push")
            ) {

                recordTrait("brave");

            }

            if (
                text.includes("kind") ||
                text.includes("hello") ||
                text.includes("friend") ||
                text.includes("offer")
            ) {

                recordTrait("kind");

            }

            if (
                text.includes("clever") ||
                text.includes("map") ||
                text.includes("listen") ||
                text.includes("solution")
            ) {

                recordTrait("clever");

            }

            if (
                text.includes("ask") ||
                text.includes("look") ||
                text.includes("follow") ||
                text.includes("flower")
            ) {

                recordTrait("curious");

            }

            if (
                text.includes("staring") ||
                text.includes("pretend") ||
                text.includes("hat")
            ) {

                recordTrait("chaotic");

            }

            if (
                text.includes("bed") ||
                text.includes("coffee") ||
                text.includes("biscuit")
            ) {

                recordTrait("cozy");

            }

            /*
             * Inventory clues from choices.
             */

            if (text.includes("note")) {
                inventory.note = true;
            }

            if (text.includes("map")) {
                inventory.map = true;
            }

            if (text.includes("coffee")) {
                inventory.coffee = true;
            }

            if (text.includes("biscuit")) {
                inventory.biscuit = true;
            }

            if (text.includes("bell")) {
                inventory.bell = true;
            }

            if (text.includes("tiny hat")) {
                inventory.hat = true;
            }

            updateInventory();

            updateTraits();

            setTimeout(
                silentSave,
                100
            );

        },
        true
    );


    /* -----------------------------------------------------
       BACK BUTTON
       ----------------------------------------------------- */

    backButton.addEventListener(
        "click",
        function () {

            /*
             * Because the original story already changes
             * scenes internally, use browser-style history
             * when available rather than modifying the
             * original scene engine.
             */

            if (window.history.length > 1) {

                window.history.back();

                showToast(
                    "Going back…"
                );

            }

        }
    );


    /* -----------------------------------------------------
       SAVE BUTTON
       ----------------------------------------------------- */

    saveButton.addEventListener(
        "click",
        save
    );


    /* -----------------------------------------------------
       AUTO SAVE
       ----------------------------------------------------- */

    setInterval(
        silentSave,
        15000
    );

    window.addEventListener(
        "beforeunload",
        silentSave
    );


    /* -----------------------------------------------------
       TITLE SCREEN
       ----------------------------------------------------- */

    updateContinueButton();

    newGameButton.addEventListener(
        "click",
        function () {

            const existing =
                localStorage.getItem(
                    SAVE_KEY
                );

            if (existing) {

                const okay =
                    confirm(
                        "Start a new Mystery Trail?\n\nYour current upgraded save will be replaced."
                    );

                if (!okay) return;

            }

            localStorage.removeItem(
                SAVE_KEY
            );

            sceneHistory = [];

            discoveredScenes =
                new Set();

            choicesMade = 0;

            inventory = {
                note:false,
                map:false,
                coffee:false,
                biscuit:false,
                bell:false,
                flower:false,
                hat:false
            };

            traitCounts = {
                brave:0,
                kind:0,
                clever:0,
                curious:0,
                chaotic:0,
                cozy:0
            };

            updateInventory();

            updateTraits();

            updateProgress();

            titleScreen.classList.add(
                "hidden"
            );

            showToast(
                "The adventure begins… 🐾"
            );

        }
    );


    continueButton.addEventListener(
        "click",
        function () {

            if (loadSave()) {

                titleScreen.classList.add(
                    "hidden"
                );

                showToast(
                    "Welcome back, little explorer ✨"
                );

            }

        }
    );


    /* -----------------------------------------------------
       KEYBOARD CONTROLS
       ----------------------------------------------------- */

    document.addEventListener(
        "keydown",
        function (event) {

            /*
             * Number keys select visible choices.
             */

            if (
                event.key === "1" ||
                event.key === "2" ||
                event.key === "3"
            ) {

                const choices =
                    Array.from(
                        document.querySelectorAll(
                            ".choice, .choices button"
                        )
                    );

                const index =
                    Number(event.key) - 1;

                if (choices[index]) {

                    choices[index].click();

                }

            }

            /*
             * Escape closes panels.
             */

            if (
                event.key === "Escape"
            ) {

                closePanels();

            }

            /*
             * S = save
             */

            if (
                event.key.toLowerCase() === "s" &&
                !event.ctrlKey &&
                !event.metaKey
            ) {

                save();

            }

        }
    );


    /* -----------------------------------------------------
       AMBIENT FOREST PARTICLES
       ----------------------------------------------------- */

    const particleSymbols = [
        "🍃",
        "·",
        "✦",
        "🌿"
    ];

    for (
        let i = 0;
        i < 18;
        i++
    ) {

        const particle =
            document.createElement(
                "div"
            );

        particle.className =
            "upgrade-particle";

        particle.textContent =
            particleSymbols[
                Math.floor(
                    Math.random() *
                    particleSymbols.length
                )
            ];

        particle.style.left =
            Math.random() * 100 +
            "vw";

        particle.style.fontSize =
            8 +
            Math.random() * 12 +
            "px";

        particle.style.animationDuration =
            9 +
            Math.random() * 13 +
            "s";

        particle.style.animationDelay =
            -(Math.random() * 15) +
            "s";

        document.body.appendChild(
            particle
        );

    }


    /* -----------------------------------------------------
       INITIAL STATE
       ----------------------------------------------------- */

    updateInventory();

    updateTraits();

    updateProgress();

    updateContinueButton();

})();
</script>
</script>

</body>
</html>
