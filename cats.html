<title>Mystery Trail 🐾</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    font-family: Georgia, serif;
    color: #eee9d8;

    background:
        radial-gradient(
            circle at top,

            #132b20 45%,

    justify-content: center;
    align-items: center;

}

#game {
    position: relative;

    border-radius: 30px;

    box-shadow:

    background: #132b20;
}

#background {
    position: absolute;
    inset: 0;
    z-index: 0;
    pointer-events: none;

    transition: background .5s ease;
}

    content: "";

    inset: 0;

    background:

            transparent 3px),

        radial-gradient(circle at 75% 30%,

            transparent 3px);

    background-size:
        150px 130px,
        210px 170px,
        190px 160px;
}

.scene-dawn {
    background:
        linear-gradient(
            to bottom,
            #294f63 0%,
            #6e8d83 52%,
            #324c34 100%

}

.scene-bedroom {
    background:

}

.scene-cottage {

.scene-path {
    background:

            #101d14 100%

}

.scene-deep {
    background:

            #12271b 55%,

        );
}

.scene-flower {

        radial-gradient(

}

}

h2 {

}

.story {

}

.choices {

.choice {

.choice:hover {

.ending {

}

}

.ending h1 {

}

.ending button {

    border: none;
    border-radius: 25px;

    color: #20291e;

}

#travelerResult {

    padding: 20px;

    border-radius: 18px;

    background:

}

#travelerResult strong {
    color: #e1cf8b;
    font-size: 24px;
}

.back {

    bottom: 15px;
    left: 15px;

    z-index: 100;

    color: #cbd6b5;

}

.back:hover {

    /* =====================================================
   MYSTERY TRAIL VISUAL UPGRADE
   ===================================================== */

* {
    box-sizing: border-box;
}

body {
    overflow-x: hidden;
}

/* Give the game a more polished glassy look */
#game {
    position: relative;
    overflow: hidden;
    border: 1px solid rgba(190, 210, 170, 0.25);
    border-radius: 24px;
    box-shadow:
        0 20px 60px rgba(0, 0, 0, 0.45),
        0 0 35px rgba(70, 110, 70, 0.12);
}

/* Atmospheric layer */
#background::before {
    content: "";
    position: absolute;
    inset: 0;
    pointer-events: none;
    background:
        radial-gradient(
            circle at 20% 30%,
            rgba(210, 230, 150, 0.08),
            transparent 3%
        ),
        radial-gradient(
            circle at 75% 20%,
            rgba(210, 230, 150, 0.07),
            transparent 3%
        ),
        radial-gradient(
            circle at 60% 75%,
            rgba(210, 230, 150, 0.06),
            transparent 3%
        );
    animation: forestGlow 7s ease-in-out infinite;
}

#background::after {
    content: "";
    position: absolute;
    inset: -20%;
    pointer-events: none;
    background:
        radial-gradient(
            ellipse at center,
            transparent 25%,
            rgba(0, 15, 7, 0.3) 100%
        );
}

@keyframes forestGlow {
    0%, 100% {
        opacity: 0.55;
        transform: scale(1);
    }

    50% {
        opacity: 1;
        transform: scale(1.04);
    }
}


/* Story entrance animation */
#content {
    animation: storyAppear 0.55s ease;
}

@keyframes storyAppear {
    from {
        opacity: 0;
        transform: translateY(12px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
}


/* Chapter label */
.chapter {
    letter-spacing: 3px;
    font-size: 12px;
    opacity: 0.8;
    text-transform: uppercase;
}


/* Big story icon */
.icon {
    animation: iconFloat 3.5s ease-in-out infinite;
    filter: drop-shadow(0 5px 10px rgba(0,0,0,0.35));
}

@keyframes iconFloat {
    0%, 100% {
        transform: translateY(0);
    }

    50% {
        transform: translateY(-7px);
    }
}


/* Title glow */
h1,
h2 {
    text-shadow:
        0 3px 12px rgba(0,0,0,0.5),
        0 0 18px rgba(210, 190, 110, 0.12);
}


/* Story text */
.story {
    text-shadow: 0 2px 4px rgba(0,0,0,0.4);
}


/* Better choice buttons */
.choice {
    position: relative;
    overflow: hidden;
    transition:
        transform 0.18s ease,
        box-shadow 0.18s ease,
        background 0.18s ease,
        border-color 0.18s ease;
}

.choice::before {
    content: "";
    position: absolute;
    top: 0;
    left: -120%;
    width: 80%;
    height: 100%;
    background: linear-gradient(
        90deg,
        transparent,
        rgba(255,255,255,0.08),
        transparent
    );
    transform: skewX(-20deg);
    transition: left 0.5s ease;
}

.choice:hover::before {
    left: 140%;
}

.choice:hover {
    transform: translateY(-3px);
    box-shadow:
        0 8px 22px rgba(0,0,0,0.3),
        0 0 12px rgba(150,180,120,0.08);
}


/* Tiny leaf particles */
.mystery-leaf {
    position: fixed;
    z-index: 5;
    pointer-events: none;
    opacity: 0.35;
    font-size: 14px;
    animation: leafFloat linear infinite;
}

@keyframes leafFloat {
    from {
        transform:
            translateY(105vh)
            translateX(0)
            rotate(0deg);
    }

    to {
        transform:
            translateY(-80px)
            translateX(80px)
            rotate(360deg);
    }
}


/* Mobile improvements */
@media (max-width: 600px) {

    #game {
        width: calc(100% - 16px);
        border-radius: 18px;
    }

    #content {
        padding-left: 18px;
        padding-right: 18px;
    }

    .story {
        font-size: 16px;
        line-height: 1.7;
    }

    .choice {
        padding: 14px;
        font-size: 16px;
    }

    .icon {
        font-size: 52px;
    }

}


/* Respect accessibility settings */
@media (prefers-reduced-motion: reduce) {

    *,
    *::before,
    *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
    }

}
    /* =====================================================
   HUD
   ===================================================== */

#mysteryHUD {
    position: fixed;
    z-index: 1000;
    top: 10px;
    left: 50%;
    transform: translateX(-50%);

    width: min(900px, calc(100% - 20px));

.mysteryHUD-left,
.mysteryHUD-right {

#mysteryHUD button {

#mysteryHUD button:hover {

}

#mysteryHUD button:disabled {
    opacity: 0.35;
    cursor: not-allowed;
    transform: none;
}


/* Progress */

#mysteryProgress {
    position: fixed;
    z-index: 999;
    top: 51px;
    left: 50%;
    transform: translateX(-50%);

    width: min(460px, calc(100% - 90px));

}

#mysteryProgressBar {
    height: 4px;

#mysteryProgressFill {

}

#mysteryProgressText {
    margin-top: 4px;

    color: rgba(238,233,216,0.7);

    font-size: 10px;
    letter-spacing: 0.5px;
}


/* Panels */

.mysteryPanel {
    position: fixed;
    z-index: 2000;

    top: 82px;

    width: 250px;

    padding: 18px;

    border: 1px solid #708465;

    background: rgba(7,20,12,0.96);

    box-shadow: 0 15px 45px rgba(0,0,0,0.5);

    backdrop-filter: blur(10px);

    display: none;
}

.mysteryPanel.open {
    display: block;
}

#mysteryTraitsPanel {
    left: 12px;
}

#mysteryBagPanel {
    right: 12px;
}

.mysteryPanel h3 {
    margin-top: 0;

    text-align: center;

    color: #e2d18e;
}

.mysteryItem {
    padding: 9px;

    margin: 5px 0;

    border-radius: 9px;

    background: rgba(255,255,255,0.05);
}

@media (max-width: 600px) {

    #mysteryHUD {
        top: 6px;
    }

    #mysteryHUD button {
        padding: 7px 8px;
        font-size: 11px;
    }

    #mysteryProgress {
        top: 48px;
    }

    .mysteryPanel {

}
    .mysteryTrait {
    display: flex;

}

.mysteryItem {
    opacity: 0.35;
    transition: 0.2s ease;

.mysteryItem.found {
    opacity: 1;

</style>

<script>

/* =========================================================
   MYSTERY TRAIL
   ========================================================= */

const content =
    document.getElementById("content");

const background =
    document.getElementById("background");


/* =========================================================
   TRAVELER TRAITS
   ========================================================= */

let traits = {
    brave: 0,
    kind: 0,
    clever: 0,
    curious: 0,
    chaotic: 0,
    cozy: 0
};


function addTrait(trait) {

    if (
        trait &&
        Object.prototype.hasOwnProperty.call(traits, trait)
    ) {
        traits[trait]++;
    }
}


/* =========================================================
   STORY
   ========================================================= */

const scenes = {

/* =========================================================
   TRAVELER TYPE
   ========================================================= */

function getTravelerType() {

    const entries =
        Object.entries(traits);

    entries.sort(function(a, b) {
        return b[1] - a[1];
    });

    const top =
        entries[0][0];

    const types = {

        brave: {
            name: "The Fearless Wanderer",
            text:
                "You charge into strange situations with impressive confidence."
        },

        kind: {
            name: "The Gentle Forest Friend",
            text:
                "You lead with kindness, even when the forest gets weird."
        },

        clever: {
            name: "The Clever Pathfinder",
            text:
                "You prefer a smart solution over a dramatic one."
        },

        curious: {
            name: "The Curious Explorer",
            text:
                "You cannot resist investigating whatever looks mysterious."
        },

        chaotic: {
            name: "The Chaotic Little Creature",
            text:
                "You somehow turn every simple decision into an adventure."
        },

        cozy: {
            name: "The Cozy Wanderer",
            text:
                "You believe every adventure should include rest, snacks and somewhere comfortable to sit."
        }

    };

    return types[top];
}


/* =========================================================
   RESTART
   ========================================================= */

function restartGame() {

    traits = {
        brave: 0,
        kind: 0,
        clever: 0,
        curious: 0,
        chaotic: 0,
        cozy: 0
    };

    showScene("start");
}


/* =========================================================
   SHOW ENDING
   ========================================================= */

function showEnding(scene) {

    const traveler =
        getTravelerType();

    content.innerHTML = `

        <div class="ending">

            <div class="bigIcon">
                ${scene.icon}
            </div>

            <div class="chapter">
                Your Ending
            </div>

            <h1>
                ${scene.title}
            </h1>

            <div class="story">
                ${scene.text}
            </div>

            <div id="travelerResult">

                <strong>
                    ${traveler.name}
                </strong>

                <br><br>

                ${traveler.text}

            </div>

            <button
                id="restartButton"
                type="button"
            >
                🌲 Start the Mystery Trail Again
            </button>

        </div>

    `;

    document
        .getElementById("restartButton")
        .addEventListener(
            "click",
            restartGame
        );
}


/* =========================================================
   SHOW SCENE
   ========================================================= */

function showScene(sceneId) {

    const scene =
        scenes[sceneId];

    if (!scene) {

        console.error(
            "Scene not found:",
            sceneId
        );

        return;
    }

    background.className =
        scene.background;

    if (scene.ending) {

        showEnding(scene);

        return;
    }

    content.innerHTML = `

        <div class="chapter">
            ${scene.chapter}
        </div>

        <div class="icon">
            ${scene.icon}
        </div>

        <h2>
            ${scene.title}
        </h2>

        <div class="story">
            ${scene.text}
        </div>

        <div
            class="choices"
            id="choices"
        ></div>

    `;

    const choicesContainer =
        document.getElementById("choices");


    scene.choices.forEach(function(choice) {

        const button =
            document.createElement("button");

        button.className =
            "choice";

        button.type =
            "button";

        button.textContent =
            choice.text;


        button.addEventListener(
            "click",
            function() {

                addTrait(choice.trait);

                showScene(
                    choice.next
                );

            }
        );


        choicesContainer.appendChild(
            button
        );

    });
}

// MYSTERY TRAIL HUD BUTTONS
// =====================================================

const traitsButton = document.getElementById("mysteryTraitsButton");
const bagButton = document.getElementById("mysteryBagButton");

const traitsPanel = document.getElementById("mysteryTraitsPanel");
const bagPanel = document.getElementById("mysteryBagPanel");


// TRAITS BUTTON
if (traitsButton && traitsPanel) {
    traitsButton.addEventListener("click", () => {

        bagPanel?.classList.remove("open");

        updateTraitsPanel();

        traitsPanel.classList.toggle("open");
    });
}


// BAG BUTTON
if (bagButton && bagPanel) {
    bagButton.addEventListener("click", () => {

        traitsPanel?.classList.remove("open");

        updateBagPanel();

        bagPanel.classList.toggle("open");
    });
}


// Close panels when clicking outside them
document.addEventListener("click", (event) => {

    if (
        !event.target.closest("#mysteryTraitsPanel") &&
        !event.target.closest("#mysteryTraitsButton")
    ) {
        traitsPanel?.classList.remove("open");
    }

    if (
        !event.target.closest("#mysteryBagPanel") &&
        !event.target.closest("#mysteryBagButton")
    ) {
        bagPanel?.classList.remove("open");
    }

});


// =====================================================
// TRAITS DISPLAY
// =====================================================

function updateTraitsPanel() {

    const box = document.getElementById("mysteryTraitsContent");

    if (!box) return;

    const traitNames = {
        brave: "🦁 Brave",
        kind: "💚 Kind",
        clever: "🧠 Clever",
        curious: "🔍 Curious",
        chaotic: "🌪️ Chaotic",
        cozy: "🛏️ Cozy"
    };

    let html = "";

    Object.keys(traitNames).forEach(trait => {

        const amount = traits[trait] || 0;

        html += `
            <div class="mysteryTrait">
                <span>${traitNames[trait]}</span>
                <strong>${amount}</strong>
            </div>
        `;
    });

    box.innerHTML = html;
}


// =====================================================
// BAG DISPLAY
// =====================================================

function updateBagPanel() {

    const items = document.querySelectorAll(
        "#mysteryBagPanel .mysteryItem"
    );

    /*
       For now this checks the game's existing progress
       rather than creating a second inventory system.
    */

    const currentText = document.body.innerText;

    const itemChecks = [
        currentText.includes("mysterious note"),
        currentText.includes("hand-drawn map"),
        currentText.includes("cup of coffee"),
        currentText.includes("biscuit"),
        currentText.includes("tiny bell"),
        currentText.includes("magical flower"),
        currentText.includes("tiny hat")
    ];

    items.forEach((item, index) => {

        if (itemChecks[index]) {
            item.classList.add("found");
        } else {
            item.classList.remove("found");
        }

    });
}
