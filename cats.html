<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Mystery Trail 🐾</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    font-family: Georgia, serif;
    color: #eee9d8;
    background:
        radial-gradient(circle at top, #294b38 0%, #132b20 42%, #07150f 100%);
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 25px 15px;
}

#game {
    position: relative;
    width: min(900px, 100%);
    min-height: 650px;
    overflow: hidden;
    border: 3px solid #607b55;
    border-radius: 30px;
    box-shadow: 0 15px 45px rgba(0,0,0,.45);
    background: #132b20;
}

/* Decorative background layer.
   IMPORTANT: it cannot block clicks. */
#background {
    position: absolute;
    inset: 0;
    z-index: 0;
    pointer-events: none;
    transition: background .5s ease;
}

#background::before {
    content: "";
    position: absolute;
    inset: 0;
    background:
        radial-gradient(circle at 15% 20%, rgba(255,255,255,.08) 0 2px, transparent 3px),
        radial-gradient(circle at 75% 30%, rgba(255,255,255,.06) 0 2px, transparent 3px),
        radial-gradient(circle at 45% 75%, rgba(255,255,255,.05) 0 2px, transparent 3px);
    background-size: 150px 130px, 210px 170px, 190px 160px;
}

.scene-dawn {
    background:
        linear-gradient(
            to bottom,
            #294f63 0%,
            #6e8d83 52%,
            #324c34 100%
        );
}

.scene-bedroom {
    background:
        radial-gradient(circle at 50% 25%, #7d6b56 0%, #433b34 35%, #171916 100%);
}

.scene-cottage {
    background:
        linear-gradient(
            to bottom,
            #536c58 0%,
            #273d2b 55%,
            #101d14 100%
        );
}

.scene-path {
    background:
        linear-gradient(
            to bottom,
            #31556a 0%,
            #294837 50%,
            #101d14 100%
        );
}

.scene-deep {
    background:
        radial-gradient(circle at 50% 35%, #31543e 0%, #12271b 55%, #06100a 100%);
}

.scene-swamp {
    background:
        radial-gradient(circle at 60% 30%, #52643a 0%, #27351e 45%, #10170d 100%);
}

.scene-witch {
    background:
        radial-gradient(circle at 50% 25%, #66526e 0%, #30253d 45%, #111018 100%);
}

.scene-flower {
    background:
        radial-gradient(circle at 50% 25%, #71634e 0%, #304a35 48%, #101a12 100%);
}

#content {
    position: relative;
    z-index: 10;
    min-height: 650px;
    padding: 45px 35px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
}

.chapter {
    margin-bottom: 10px;
    color: #b8c99d;
    font-size: 14px;
    letter-spacing: 2px;
    text-transform: uppercase;
}

.icon {
    font-size: 75px;
    margin-bottom: 10px;
    filter: drop-shadow(0 5px 8px rgba(0,0,0,.3));
}

h1 {
    margin: 0 0 15px;
    text-align: center;
    color: #e3d39a;
    font-size: clamp(30px, 6vw, 52px);
}

h2 {
    margin: 0 0 20px;
    color: #d5c38c;
    font-size: 28px;
    text-align: center;
}

.story {
    width: min(680px, 100%);
    margin: 0 auto 30px;
    font-size: 18px;
    line-height: 1.75;
    text-align: center;
    color: #eee9d8;
}

.choices {
    width: min(650px, 100%);
    display: flex;
    flex-direction: column;
    gap: 13px;
}

.choice {
    position: relative;
    z-index: 20;
    pointer-events: auto;

    width: 100%;
    padding: 16px 20px;

    border: 2px solid #6c825c;
    border-radius: 16px;

    background: rgba(25, 43, 31, .92);
    color: #f0ead8;

    font-family: Georgia, serif;
    font-size: 17px;
    line-height: 1.4;

    cursor: pointer;
    transition:
        transform .15s ease,
        background .15s ease,
        border-color .15s ease;
}

.choice:hover {
    transform: translateY(-2px);
    background: rgba(56, 79, 53, .98);
    border-color: #a5b87e;
}

.choice:active {
    transform: translateY(0);
}

.ending {
    width: min(650px, 100%);
    text-align: center;
}

.ending .bigIcon {
    font-size: 90px;
    margin-bottom: 15px;
}

.ending h1 {
    font-size: clamp(28px, 6vw, 48px);
}

.ending button {
    position: relative;
    z-index: 20;
    margin-top: 10px;
    padding: 13px 26px;
    border: none;
    border-radius: 25px;
    background: #d2b86c;
    color: #20291e;
    font-family: Georgia, serif;
    font-weight: bold;
    font-size: 16px;
    cursor: pointer;
}

#travelerResult {
    margin-top: 20px;
    padding: 20px;
    border: 2px solid #657d59;
    border-radius: 18px;
    background: rgba(13, 25, 17, .65);
}

#travelerResult strong {
    color: #e1cf8b;
    font-size: 24px;
}

.back {
    position: fixed;
    bottom: 15px;
    left: 15px;
    z-index: 100;

    color: #cbd6b5;
    text-decoration: none;
    font-size: 14px;
}

.back:hover {
    color: white;
}

@media (max-width: 600px) {
    body {
        padding: 10px;
        align-items: flex-start;
    }

    #game {
        min-height: calc(100vh - 20px);
    }

    #content {
        min-height: calc(100vh - 20px);
        padding: 35px 18px 65px;
    }

    .icon {
        font-size: 60px;
    }

    .story {
        font-size: 16px;
        line-height: 1.65;
    }

    .choice {
        font-size: 15px;
        padding: 14px 15px;
    }
}
</style>
</head>

<body>

<div id="game">

    <div id="background" class="scene-dawn"></div>

    <div id="content">
        <!-- Story gets inserted here -->
    </div>

</div>

<a href="forest.html" class="back">
    🌲 Return to the Forest
</a>

function addTrait(trait) {
    if (trait && traits.hasOwnProperty(trait)) {
        traits[trait]++;
    }
}

function getTravelerType() {
    const entries = Object.entries(traits);

    entries.sort(function(a, b) {
        return b[1] - a[1];
    });

    const top = entries[0][0];

    const types = {
        brave: {
            name: "The Fearless Wanderer",
            text: "You charge into strange situations with impressive confidence."
        },

        kind: {
            name: "The Gentle Forest Friend",
            text: "You lead with kindness, even when the forest gets weird."
        },

        clever: {
            name: "The Clever Pathfinder",
            text: "You prefer a smart solution over a dramatic one."
        },

        curious: {
            name: "The Curious Explorer",
            text: "You cannot resist investigating whatever looks mysterious."
        },

        chaotic: {
            name: "The Chaotic Little Creature",
            text: "You somehow turn every simple decision into an adventure."
        },

        cozy: {
            name: "The Cozy Wanderer",
            text: "You believe every adventure should include rest, snacks, and a comfortable place to sit."
        }
    };

    return types[top];
}

function restartGame() {
    traits = {
        brave: 0,
        kind: 0,
        clever: 0,
        curious: 0,
        chaotic: 0,
        cozy: 0
    };

    showScene("start");
}

function showEnding(scene) {
    const traveler = getTravelerType();

    content.innerHTML = `
        <div class="ending">

            <div class="bigIcon">${scene.icon}</div>

            <div class="chapter">Your Ending</div>

            <h1>${scene.title}</h1>

            <div class="story">
                ${scene.text}
            </div>

            <div id="travelerResult">
                <strong>${traveler.name}</strong>
                <br><br>
                ${traveler.text}
            </div>

            <button id="restartButton">
                🌲 Start the Mystery Trail Again
            </button>

        </div>
    `;

    document
        .getElementById("restartButton")
        .addEventListener("click", restartGame);
}

function showScene(sceneId) {
    const scene = scenes[sceneId];

    if (!scene) {
        console.error("Scene not found:", sceneId);
        return;
    }

    background.className = scene.background;

    if (scene.ending) {
        showEnding(scene);
        return;
    }

    content.innerHTML = `
        <div class="chapter">${scene.chapter}</div>

        <div class="icon">${scene.icon}</div>

        <h2>${scene.title}</h2>

        <div class="story">
            ${scene.text}
        </div>

        <div class="choices" id="choices"></div>
    `;

    const choicesContainer = document.getElementById("choices");

    scene.choices.forEach(function(choice) {

        const button = document.createElement("button");

        button.className = "choice";
        button.type = "button";
        button.textContent = choice.text;

        /*
            The listener is attached directly to the button.
            No overlay or inline click handler is involved.
        */
        button.addEventListener("click", function() {

            addTrait(choice.trait);

            showScene(choice.next);
        });

        choicesContainer.appendChild(button);
    });
}

/* Start the game */
showScene("start");
