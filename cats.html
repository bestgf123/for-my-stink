<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Mystery Trail 🐾</title>

<style>
* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    min-height: 100%;
}

body {
    min-height: 100vh;
    font-family: Georgia, serif;
    color: #eee9d8;

    background:
        radial-gradient(
            circle at top,
            #294b38 0%,
            #132b20 45%,
            #07150f 100%
        );

    display: flex;
    justify-content: center;
    align-items: center;
    padding: 25px 15px;

    overflow-x: hidden;
}


/* =====================================================
   GAME
   ===================================================== */

#game {
    position: relative;
    width: min(900px, 100%);
    min-height: 650px;

    overflow: hidden;

    border: 1px solid rgba(190, 210, 170, 0.25);
    border-radius: 24px;

    box-shadow:
        0 20px 60px rgba(0, 0, 0, 0.45),
        0 0 35px rgba(70, 110, 70, 0.12);

    background: #132b20;
}

#background {
    position: absolute;
    inset: 0;
    z-index: 0;
    pointer-events: none;

    transition: background .5s ease;
}

#background::before {
    content: "";
    position: absolute;
    inset: 0;

    background:
        radial-gradient(
            circle at 20% 30%,
            rgba(210, 230, 150, 0.08),
            transparent 3%
        ),
        radial-gradient(
            circle at 75% 20%,
            rgba(210, 230, 150, 0.07),
            transparent 3%
        ),
        radial-gradient(
            circle at 60% 75%,
            rgba(210, 230, 150, 0.06),
            transparent 3%
        );

    animation: forestGlow 7s ease-in-out infinite;
}

#background::after {
    content: "";
    position: absolute;
    inset: -20%;
    pointer-events: none;

    background:
        radial-gradient(
            ellipse at center,
            transparent 25%,
            rgba(0, 15, 7, 0.3) 100%
        );
}

@keyframes forestGlow {
    0%, 100% {
        opacity: 0.55;
        transform: scale(1);
    }

    50% {
        opacity: 1;
        transform: scale(1.04);
    }
}


/* =====================================================
   BACKGROUNDS
   ===================================================== */

.scene-dawn {
    background:
        linear-gradient(
            to bottom,
            #294f63 0%,
            #6e8d83 52%,
            #324c34 100%
        );
}

.scene-bedroom {
    background:
        radial-gradient(
            circle at 50% 25%,
            #7d6b56 0%,
            #433b34 35%,
            #171916 100%
        );
}

.scene-cottage {
    background:
        linear-gradient(
            to bottom,
            #536c58 0%,
            #273d2b 55%,
            #101d14 100%
        );
}

.scene-path {
    background:
        linear-gradient(
            to bottom,
            #31556a 0%,
            #294837 50%,
            #101d14 100%
        );
}

.scene-deep {
    background:
        radial-gradient(
            circle at 50% 35%,
            #31543e 0%,
            #12271b 55%,
            #06100a 100%
        );
}

.scene-flower {
    background:
        radial-gradient(
            circle at 50% 25%,
            #71634e 0%,
            #304a35 48%,
            #101a12 100%
        );
}

.scene-witch {
    background:
        radial-gradient(
            circle at 50% 25%,
            #66526e 0%,
            #30253d 45%,
            #111018 100%
        );
}

.scene-swamp {
    background:
        radial-gradient(
            circle at 60% 30%,
            #52643a 0%,
            #27351e 45%,
            #10170d 100%
        );
}


/* =====================================================
   CONTENT
   ===================================================== */

#content {
    position: relative;
    z-index: 10;

    min-height: 650px;

    padding: 45px 35px;

    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;

    animation: storyAppear .55s ease;
}

@keyframes storyAppear {
    from {
        opacity: 0;
        transform: translateY(12px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
}


/* =====================================================
   TYPOGRAPHY
   ===================================================== */

.chapter {
    margin-bottom: 10px;

    color: #b8c99d;

    font-size: 12px;
    letter-spacing: 3px;
    text-transform: uppercase;

    opacity: .8;
}

.icon {
    font-size: 75px;
    margin-bottom: 10px;

    animation: iconFloat 3.5s ease-in-out infinite;

    filter:
        drop-shadow(0 5px 10px rgba(0,0,0,.35));
}

@keyframes iconFloat {
    0%, 100% {
        transform: translateY(0);
    }

    50% {
        transform: translateY(-7px);
    }
}

h1 {
    margin: 0 0 15px;

    text-align: center;

    color: #e3d39a;

    font-size:
        clamp(30px, 6vw, 52px);

    text-shadow:
        0 3px 12px rgba(0,0,0,.5),
        0 0 18px rgba(210,190,110,.12);
}

h2 {
    margin: 0 0 20px;

    color: #d5c38c;

    font-size: 28px;
    text-align: center;

    text-shadow:
        0 3px 12px rgba(0,0,0,.5),
        0 0 18px rgba(210,190,110,.12);
}

.story {
    width: min(680px, 100%);

    margin:
        0 auto 30px;

    font-size: 18px;
    line-height: 1.75;

    text-align: center;

    color: #eee9d8;

    text-shadow:
        0 2px 4px rgba(0,0,0,.4);
}


/* =====================================================
   CHOICES
   ===================================================== */

.choices {
    width: min(650px, 100%);

    display: flex;
    flex-direction: column;

    gap: 13px;
}

.choice {
    position: relative;
    z-index: 20;

    overflow: hidden;

    pointer-events: auto;

    width: 100%;

    padding: 16px 20px;

    border:
        2px solid #6c825c;

    border-radius: 16px;

    background:
        rgba(25,43,31,.92);

    color: #f0ead8;

    font-family: Georgia, serif;
    font-size: 17px;
    line-height: 1.4;

    cursor: pointer;

    transition:
        transform .18s ease,
        box-shadow .18s ease,
        background .18s ease,
        border-color .18s ease;
}

.choice::before {
    content: "";

    position: absolute;
    top: 0;
    left: -120%;

    width: 80%;
    height: 100%;

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(255,255,255,.08),
            transparent
        );

    transform: skewX(-20deg);

    transition:
        left .5s ease;
}

.choice:hover::before {
    left: 140%;
}

.choice:hover {
    transform: translateY(-3px);

    background:
        rgba(56,79,53,.98);

    border-color: #a5b87e;

    box-shadow:
        0 8px 22px rgba(0,0,0,.3),
        0 0 12px rgba(150,180,120,.08);
}

.choice:active {
    transform: translateY(0);
}


/* =====================================================
   ENDING
   ===================================================== */

.ending {
    width: min(650px, 100%);

    text-align: center;
}

.ending .bigIcon {
    font-size: 90px;
    margin-bottom: 15px;
}

.ending h1 {
    font-size:
        clamp(28px, 6vw, 48px);
}

.ending button {
    position: relative;
    z-index: 20;

    margin-top: 20px;

    padding: 13px 26px;

    border: none;
    border-radius: 25px;

    background: #d2b86c;

    color: #20291e;

    font-family: Georgia, serif;
    font-weight: bold;
    font-size: 16px;

    cursor: pointer;

    transition: .18s ease;
}

.ending button:hover {
    transform: translateY(-2px);
    box-shadow:
        0 8px 20px rgba(0,0,0,.3);
}

#travelerResult {
    margin-top: 20px;
    padding: 20px;

    border:
        2px solid #657d59;

    border-radius: 18px;

    background:
        rgba(13,25,17,.65);
}

#travelerResult strong {
    color: #e1cf8b;
    font-size: 24px;
}


/* =====================================================
   HOME SCREEN
   ===================================================== */

.homeScreen {
    width: min(620px, 100%);

    text-align: center;
}

.homeIcon {
    font-size: 100px;

    margin-bottom: 10px;

    animation:
        homeFloat 4s ease-in-out infinite;

    filter:
        drop-shadow(0 8px 15px rgba(0,0,0,.4));
}

@keyframes homeFloat {
    0%, 100% {
        transform: translateY(0);
    }

    50% {
        transform: translateY(-8px);
    }
}

.homeScreen h1 {
    margin-bottom: 8px;
}

.homeSubtitle {
    margin:
        0 auto 30px;

    max-width: 520px;

    color: #d7d9c6;

    font-size: 17px;
    line-height: 1.7;
}

.homeButtons {
    display: flex;
    flex-direction: column;

    gap: 12px;

    width: min(430px, 100%);

    margin: 0 auto;
}

.homeButton {
    position: relative;
    z-index: 20;

    padding: 15px 20px;

    border:
        2px solid #6c825c;

    border-radius: 16px;

    background:
        rgba(25,43,31,.9);

    color: #f0ead8;

    font-family: Georgia, serif;

    font-size: 17px;
    font-weight: bold;

    cursor: pointer;

    transition: .18s ease;
}

.homeButton:hover {
    transform: translateY(-3px);

    background:
        rgba(56,79,53,.98);

    border-color: #a5b87e;

    box-shadow:
        0 8px 22px rgba(0,0,0,.3);
}

.homeButton.primary {
    background:
        rgba(86,101,62,.95);

    border-color: #b0bd83;

    color: #fff7df;
}

.homeButton:disabled {
    opacity: .4;
    cursor: not-allowed;
    transform: none;
}

.homeStatus {
    margin-top: 22px;

    min-height: 22px;

    color: rgba(238,233,216,.7);

    font-size: 13px;
}


/* =====================================================
   TRAIL TRACKER
   ===================================================== */

.trailTracker {
    width: min(680px, 100%);

    text-align: center;
}

.trailCount {
    margin:
        5px auto 22px;

    padding: 18px;

    border:
        1px solid rgba(190,210,170,.25);

    border-radius: 18px;

    background:
        rgba(7,20,12,.55);
}

.trailCountNumber {
    color: #e1cf8b;

    font-size: 42px;
    font-weight: bold;
}

.trailCountLabel {
    margin-top: 4px;

    color: #b8c99d;

    font-size: 13px;
    letter-spacing: 1px;
}

.trailList {
    display: flex;
    flex-direction: column;

    gap: 9px;

    max-height: 360px;

    overflow-y: auto;

    padding-right: 4px;
}

.trailItem {
    display: flex;

    align-items: center;

    gap: 12px;

    padding: 12px 14px;

    border:
        1px solid rgba(180,200,155,.2);

    border-radius: 13px;

    background:
        rgba(7,20,12,.55);

    text-align: left;
}

.trailItemIcon {
    width: 40px;

    text-align: center;

    font-size: 26px;
}

.trailItemName {
    flex: 1;

    color: #eee9d8;

    font-size: 15px;
}

.trailItemNumber {
    color: #9eae83;

    font-size: 12px;
}

.trailEmpty {
    padding: 25px;

    color: rgba(238,233,216,.65);

    line-height: 1.7;
}

.trailBackButton {
    position: relative;
    z-index: 20;

    margin-top: 20px;

    padding: 12px 23px;

    border: 1px solid #788c65;

    border-radius: 20px;

    background:
        rgba(25,43,31,.9);

    color: #eee9d8;

    font-family: Georgia, serif;

    cursor: pointer;
}

.trailBackButton:hover {
    background:
        rgba(56,79,53,.98);
}


/* =====================================================
   HUD
   ===================================================== */

#mysteryHUD {
    position: fixed;
    z-index: 1000;

    top: 10px;
    left: 50%;

    transform: translateX(-50%);

    width:
        min(900px, calc(100% - 20px));

    display: flex;

    justify-content: space-between;

    gap: 8px;

    pointer-events: none;
}

.mysteryHUD-left,
.mysteryHUD-right {
    display: flex;

    gap: 6px;

    pointer-events: auto;
}

#mysteryHUD button {
    border:
        1px solid rgba(180,200,155,.5);

    border-radius: 12px;

    padding: 8px 11px;

    background:
        rgba(7,20,12,.88);

    color: #eee9d8;

    font-family: Georgia, serif;

    font-size: 12px;

    cursor: pointer;

    backdrop-filter: blur(8px);

    transition: .18s ease;
}

#mysteryHUD button:hover {
    transform: translateY(-2px);

    background:
        rgba(35,65,42,.95);
}

#mysteryHUD button:disabled {
    opacity: .35;

    cursor: not-allowed;

    transform: none;
}


/* =====================================================
   PROGRESS
   ===================================================== */

#mysteryProgress {
    position: fixed;
    z-index: 999;

    top: 51px;
    left: 50%;

    transform: translateX(-50%);

    width:
        min(460px, calc(100% - 90px));

    text-align: center;
}

#mysteryProgressBar {
    height: 4px;

    overflow: hidden;

    border-radius: 10px;

    background:
        rgba(255,255,255,.12);
}

#mysteryProgressFill {
    width: 0%;
    height: 100%;

    border-radius: 10px;

    background: #cbbd7d;

    transition:
        width .5s ease;
}

#mysteryProgressText {
    margin-top: 4px;

    color:
        rgba(238,233,216,.7);

    font-size: 10px;

    letter-spacing: .5px;
}


/* =====================================================
   PANELS
   ===================================================== */

.mysteryPanel {
    position: fixed;
    z-index: 2000;

    top: 82px;

    width: 250px;

    max-height:
        calc(100vh - 105px);

    overflow-y: auto;

    padding: 18px;

    border:
        1px solid #708465;

    border-radius: 17px;

    background:
        rgba(7,20,12,.96);

    box-shadow:
        0 15px 45px rgba(0,0,0,.5);

    backdrop-filter: blur(10px);

    display: none;
}

.mysteryPanel.open {
    display: block;
}

#mysteryTraitsPanel {
    left: 12px;
}

#mysteryBagPanel {
    right: 12px;
}

.mysteryPanel h3 {
    margin-top: 0;

    text-align: center;

    color: #e2d18e;
}

.mysteryItem {
    padding: 9px;

    margin: 5px 0;

    border-radius: 9px;

    background:
        rgba(255,255,255,.05);

    opacity: .35;

    transition: .2s ease;
}

.mysteryItem.found {
    opacity: 1;

    background:
        rgba(120,150,100,.15);
}

.mysteryTrait {
    display: flex;

    justify-content: space-between;

    align-items: center;

    padding: 8px 10px;

    margin: 5px 0;

    border-radius: 9px;

    background:
        rgba(255,255,255,.05);
}

.mysteryTrait strong {
    color: #e2d18e;
}


/* =====================================================
   BACK LINK
   ===================================================== */

.back {
    position: fixed;

    bottom: 15px;
    left: 15px;

    z-index: 100;

    color: #cbd6b5;

    text-decoration: none;

    font-size: 14px;
}

.back:hover {
    color: white;
}


/* =====================================================
   LEAVES
   ===================================================== */

.mystery-leaf {
    position: fixed;

    z-index: 5;

    pointer-events: none;

    opacity: .35;

    font-size: 14px;

    animation:
        leafFloat linear infinite;
}

@keyframes leafFloat {
    from {
        transform:
            translateY(105vh)
            translateX(0)
            rotate(0deg);
    }

    to {
        transform:
            translateY(-80px)
            translateX(80px)
            rotate(360deg);
    }
}


/* =====================================================
   MOBILE
   ===================================================== */

@media (max-width: 600px) {

    body {
        padding: 10px;

        align-items: flex-start;
    }

    #game {
        width:
            calc(100% - 16px);

        min-height:
            calc(100vh - 20px);

        border-radius: 18px;
    }

    #content {
        min-height:
            calc(100vh - 20px);

        padding:
            35px 18px 65px;
    }

    .icon {
        font-size: 52px;
    }

    .story {
        font-size: 16px;

        line-height: 1.7;
    }

    .choice {
        padding: 14px;

        font-size: 16px;
    }

    .homeIcon {
        font-size: 75px;
    }

    .homeSubtitle {
        font-size: 15px;
    }

    .homeButton {
        font-size: 15px;
    }

    #mysteryHUD {
        top: 6px;
    }

    #mysteryHUD button {
        padding: 7px 8px;

        font-size: 11px;
    }

    #mysteryProgress {
        top: 48px;
    }

    .mysteryPanel {
        left: 10px !important;
        right: 10px !important;

        width: auto;
    }

    .trailTracker {
        padding-top: 10px;
    }

    .trailList {
        max-height: 300px;
    }

    .back {
        display: none;
    }
}


/* =====================================================
   ACCESSIBILITY
   ===================================================== */

@media (prefers-reduced-motion: reduce) {

    *,
    *::before,
    *::after {
        animation-duration: .01ms !important;

        transition-duration: .01ms !important;
    }
}
</style>
</head>

<body>


<!-- =====================================================
     MYSTERY TRAIL HUD
     ===================================================== -->

<div id="mysteryHUD">

    <div class="mysteryHUD-left">

        <button
            type="button"
            id="mysterySaveButton">
            💾 Save
        </button>

        <button
            type="button"
            id="mysteryBackButton">
            ← Back
        </button>

    </div>

    <div class="mysteryHUD-right">

        <button
            type="button"
            id="mysteryTraitsButton">
            🧠 Traits
        </button>

        <button
            type="button"
            id="mysteryBagButton">
            🎒 Bag
        </button>

        <button
            type="button"
            id="mysteryTrailsButton">
            🐾 Trails
        </button>

    </div>

</div>


<!-- =====================================================
     PROGRESS
     ===================================================== -->

<div id="mysteryProgress">

    <div id="mysteryProgressBar">
        <div id="mysteryProgressFill"></div>
    </div>

    <div id="mysteryProgressText">
        Your adventure begins…
    </div>

</div>


<!-- =====================================================
     TRAITS PANEL
     ===================================================== -->

<div
    id="mysteryTraitsPanel"
    class="mysteryPanel">

    <h3>
        🧠 Your Personality
    </h3>

    <p>
        Your choices are shaping who you become.
    </p>

    <div id="mysteryTraitsContent">
        Your personality will appear here.
    </div>

</div>


<!-- =====================================================
     BAG PANEL
     ===================================================== -->

<div
    id="mysteryBagPanel"
    class="mysteryPanel">

    <h3>
        🎒 Adventure Bag
    </h3>

    <div
        class="mysteryItem"
        data-item="note">
        📜 Mysterious Note
    </div>

    <div
        class="mysteryItem"
        data-item="map">
        🗺️ Forest Map
    </div>

    <div
        class="mysteryItem"
        data-item="coffee">
        ☕ Forest Coffee
    </div>

    <div
        class="mysteryItem"
        data-item="biscuit">
        🍪 Guardian Biscuit
    </div>

    <div
        class="mysteryItem"
        data-item="bell">
        🔔 Witch's Bell
    </div>

    <div
        class="mysteryItem"
        data-item="flower">
        🌼 Magical Flower
    </div>

    <div
        class="mysteryItem"
        data-item="hat">
        🎩 Tiny Hat
    </div>

</div>


<!-- =====================================================
     GAME
     ===================================================== -->

<div id="game">

    <div
        id="background"
        class="scene-dawn">
    </div>

    <div id="content"></div>

</div>


<a
    href="forest.html"
    class="back">
    🌲 Return to the Forest
</a>


<script>

/* =========================================================
   ELEMENTS
   ========================================================= */

const content =
    document.getElementById("content");

const background =
    document.getElementById("background");


/* =========================================================
   STORAGE
   ========================================================= */

const SAVE_KEY =
    "mysteryTrailSave";

const TRAILS_KEY =
    "mysteryTrailCompleted";

const ITEMS_KEY =
    "mysteryTrailItems";


/* =========================================================
   TRAITS
   ========================================================= */

let traits = {
    brave: 0,
    kind: 0,
    clever: 0,
    curious: 0,
    chaotic: 0,
    cozy: 0
};


/* =========================================================
   GAME STATE
   ========================================================= */

let currentSceneId = "start";

let gameStarted = false;

let previousSceneId = null;


/* =========================================================
   TRAIL / ENDING DATA
   ========================================================= */

const endingOrder = [
    "napEnding",
    "doorEnding",
    "lostEnding",
    "guardianEnding",
    "hatEnding",
    "witchEnding"
];


const endingNames = {

    napEnding: {
        icon: "🛏️",
        name: "The Extremely Well-Rested Ending"
    },

    doorEnding: {
        icon: "🚪",
        name: "The Door Slam Ending"
    },

    lostEnding: {
        icon: "🌲",
        name: "The Lost Ending"
    },

    guardianEnding: {
        icon: "🐻",
        name: "The Forest Friend Ending"
    },

    hatEnding: {
        icon: "🎩",
        name: "The Tiny Hat Ending"
    },

    witchEnding: {
        icon: "🧙‍♀️",
        name: "You Saved the Forest!"
    }

};


/* =========================================================
   TRAITS
   ========================================================= */

function addTrait(trait) {

    if (
        trait &&
        Object.prototype.hasOwnProperty.call(
            traits,
            trait
        )
    ) {
        traits[trait]++;
    }
}


/* =========================================================
   RESET TRAITS
   ========================================================= */

function resetTraits() {

    traits = {
        brave: 0,
        kind: 0,
        clever: 0,
        curious: 0,
        chaotic: 0,
        cozy: 0
    };

}


/* =========================================================
   SAVE / LOAD HELPERS
   ========================================================= */

function getCompletedTrails() {

    try {

        const saved =
            localStorage.getItem(
                TRAILS_KEY
            );

        if (!saved) {
            return [];
        }

        const parsed =
            JSON.parse(saved);

        return Array.isArray(parsed)
            ? parsed
            : [];

    } catch (error) {

        console.error(
            "Could not read completed trails:",
            error
        );

        return [];
    }
}


function saveCompletedTrails(trailsList) {

    localStorage.setItem(
        TRAILS_KEY,
        JSON.stringify(trailsList)
    );

}


/* =========================================================
   RECORD ENDING
   ========================================================= */

function recordEnding(sceneId) {

    if (
        !endingOrder.includes(sceneId)
    ) {
        return;
    }

    const completed =
        getCompletedTrails();

    if (
        !completed.includes(sceneId)
    ) {

        completed.push(sceneId);

        saveCompletedTrails(
            completed
        );
    }

}


/* =========================================================
   ITEMS
   ========================================================= */

function getItems() {

    try {

        const saved =
            localStorage.getItem(
                ITEMS_KEY
            );

        if (!saved) {
            return {};
        }

        return JSON.parse(saved);

    } catch (error) {

        return {};
    }
}


function setItem(item) {

    if (!item) {
        return;
    }

    const items =
        getItems();

    items[item] = true;

    localStorage.setItem(
        ITEMS_KEY,
        JSON.stringify(items)
    );

}


/* =========================================================
   DETECT STORY ITEMS
   ========================================================= */

function detectItems(sceneId) {

    const scene =
        scenes[sceneId];

    if (!scene) {
        return;
    }

    const text =
        (
            scene.title +
            " " +
            scene.text
        ).toLowerCase();


    if (
        sceneId === "readNote" ||
        text.includes("folded note")
    ) {
        setItem("note");
    }


    if (
        sceneId === "searchMap" ||
        text.includes("hand-drawn map")
    ) {
        setItem("map");
    }


    if (
        sceneId === "coffee" ||
        sceneId === "coffeeVisitor" ||
        text.includes("cup of coffee")
    ) {
        setItem("coffee");
    }


    if (
        sceneId === "biscuitGuardian" ||
        sceneId === "guardianAdvice" ||
        sceneId === "witchAdvice" ||
        text.includes("biscuit")
    ) {
        setItem("biscuit");
    }


    if (
        sceneId === "witchTrick" ||
        sceneId === "bellGuardian" ||
        text.includes("tiny bell")
    ) {
        setItem("bell");
    }


    if (
        sceneId === "flowerGranted" ||
        text.includes("magical flower")
    ) {
        setItem("flower");
    }


    if (
        sceneId === "guardianHat" ||
        sceneId === "hatEnding" ||
        text.includes("tiny hat")
    ) {
        setItem("hat");
    }

}


/* =========================================================
   SAVE GAME
   ========================================================= */

function saveGame(showMessage = true) {

    if (!gameStarted) {
        return;
    }

    const saveData = {

        sceneId:
            currentSceneId,

        previousSceneId:
            previousSceneId,

        traits:
            { ...traits },

        savedAt:
            Date.now()

    };


    try {

        localStorage.setItem(
            SAVE_KEY,
            JSON.stringify(saveData)
        );


        if (showMessage) {

            showTemporaryMessage(
                "💾 Game saved!"
            );

        }

    } catch (error) {

        console.error(
            "Could not save game:",
            error
        );

    }

}


/* =========================================================
   LOAD SAVE
   ========================================================= */

function getSave() {

    try {

        const saved =
            localStorage.getItem(
                SAVE_KEY
            );

        if (!saved) {
            return null;
        }

        const data =
            JSON.parse(saved);

        if (
            !data ||
            !data.sceneId ||
            !scenes[data.sceneId]
        ) {
            return null;
        }

        return data;

    } catch (error) {

        console.error(
            "Could not load save:",
            error
        );

        return null;
    }

}

    }


    resetTraits();


    if (save.traits) {

        Object.keys(traits)

                    traits[trait] =

    showScene(

            );

}


/* =========================================================
   PROGRESS CALCULATION
   ========================================================= */

function getReachableScenes() {

    const visited =
        new Set();

    const queue =
        ["start"];


    while (queue.length) {

        const id =
            queue.shift();

        if (
            visited.has(id) ||
            !scenes[id]
        ) {
            continue;
        }


        visited.add(id);


        const scene =
            scenes[id];


        if (
            scene.choices
        ) {

            scene.choices
                .forEach(
                    function(choice) {

                        if (
                            !visited.has(
                                choice.next
                            )
                        ) {

                            queue.push(
                                choice.next
                            );

                        }

                    }
                );

        }

    }


    return visited;
}


const reachableScenes =
    getReachableScenes();


function updateProgress(sceneId) {

    const fill =
        document.getElementById(
            "mysteryProgressFill"
        );

    const text =
        document.getElementById(
            "mysteryProgressText"
        );


    if (!fill || !text) {
        return;
    }


    const scene =
        scenes[sceneId];


    if (!scene) {
        return;
    }


    if (scene.ending) {

        fill.style.width =
            "100%";

        text.textContent =
            "Trail complete!";

        return;
    }


    const chapterNumber =
        parseInt(
            String(
                scene.chapter || ""
            ).replace(
                /\D/g,
                ""
            ),
            10
        ) || 1;


    const maxChapter =
        13;


    const percent =
        Math.min(
            95,
            Math.max(
                5,
                (chapterNumber / maxChapter) * 100
            )
        );


    fill.style.width =
        percent + "%";


    text.textContent =
        scene.chapter +
        " • Your story is unfolding…";

}
