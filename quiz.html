<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Realm of Westeros</title>

    <style>
        body {
            margin: 0;
            padding: 30px 20px;
            background: #1c2d22;
            color: #f5efd9;
            font-family: Georgia, serif;
            text-align: center;
        }

        .quiz {
            max-width: 700px;
            margin: auto;
        }

        h1 {
            font-size: 45px;
            color: #e7ce86;
        }

        .question {
            background: #f5efd9;
            color: #263628;
            padding: 25px;
            margin: 25px 0;
            border-radius: 18px;
        }

        button {
            display: block;
            width: 100%;
            margin: 10px 0;
            padding: 13px;
            border-radius: 10px;
            border: 1px solid #a58d50;
            background: white;
            font-family: Georgia, serif;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #e5ddc4;
        }

        #result {
            display: none;
            background: #f5efd9;
            color: #263628;
            padding: 30px;
            border-radius: 18px;
            margin-top: 30px;
        }

        a {
            color: #f5efd9;
        }
    </style>
</head>

<body>

<div class="quiz">

    <div style="font-size:60px;">🐉</div>

    <h1>The Realm of Westeros</h1>

    <p>How well do you know Game of Thrones?</p>


    <div class="question">

        <h2>1. What is Jon Snow's direwolf called?</h2>

        <button onclick="answer(this, false)">Grey Wind</button>
        <button onclick="answer(this, true)">Ghost</button>
        <button onclick="answer(this, false)">Summer</button>
        <button onclick="answer(this, false)">Nymeria</button>

    </div>


    <div class="question">

        <h2>2. What is Arya Stark's sword called?</h2>

        <button onclick="answer(this, false)">Longclaw</button>
        <button onclick="answer(this, true)">Needle</button>
        <button onclick="answer(this, false)">Ice</button>
        <button onclick="answer(this, false)">Heartsbane</button>

    </div>


    <div class="question">

        <h2>3. What is the capital of the Seven Kingdoms?</h2>

        <button onclick="answer(this, true)">King's Landing</button>
        <button onclick="answer(this, false)">Winterfell</button>
        <button onclick="answer(this, false)">Dragonstone</button>
        <button onclick="answer(this, false)">The Eyrie</button>

    </div>


    <div id="result">

        <h2 id="resultTitle"></h2>

        <p id="resultText"></p>

        <a href="forest.html">🌲 Return to the Forest</a>

    </div>

</div>


<script>

    let score = 0;
    let answered = 0;

    function answer(button, correct) {

        const question = button.parentElement;

        if (question.dataset.done) {
            return;
        }

        question.dataset.done = "yes";

        answered++;

        if (correct) {
            button.style.background = "#b8d4b5";
            score++;
        } else {
            button.style.background = "#d9aaa4";
        }

        const buttons = question.querySelectorAll("button");

        buttons.forEach(function(btn) {
            btn.disabled = true;
        });

        if (answered === 3) {
            showResult();
        }
    }


    function showResult() {

        const result = document.getElementById("result");
        const title = document.getElementById("resultTitle");
        const text = document.getElementById("resultText");

        result.style.display = "block";

        if (score === 3) {

            title.innerHTML = "👑 The King of Westeros!";
            text.innerHTML = "Perfect score. The Iron Throne is yours.";

        } else if (score === 2) {

            title.innerHTML = "🐺 A Worthy Stark";
            text.innerHTML = "Not bad, Stink. You might survive the North.";

        } else {

            title.innerHTML = "🐌 You Know Nothing, Stink";
            text.innerHTML = "The Maesters are concerned.";

        }
    }

</script>

</body>
</html>
