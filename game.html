<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Mr Tapus & The Princess 🐈</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #102719;
    color: #f5edd5;
    font-family: Georgia, serif;
    text-align: center;
}

h1 {
    color: #f2dfa0;
    margin: 15px 0 5px;
}

.instructions {
    color: #d5ceb7;
}

#score {
    color: #f2dfa0;
    font-size: 20px;
    margin: 10px;
}

#game {

    position: relative;

    width: 95vw;
    max-width: 900px;

    height: 500px;

    margin: auto;

    overflow: hidden;

    border: 4px solid #8e7547;

    border-radius: 20px;

    background:
        linear-gradient(
            #294b37 0%,
            #55734b 62%,
            #19351f 62%,
            #19351f 100%
        );

    box-shadow:
        0 15px 40px rgba(0,0,0,.5);
}


/* MOON */

.moon {
    position: absolute;
    top: 20px;
    right: 35px;
    font-size: 55px;
}


/* TREES */

.tree {
    position: absolute;
    bottom: 80px;
    font-size: 65px;
}

.tree1 {
    left: 20px;
}

.tree2 {
    left: 260px;
}

.tree3 {
    left: 500px;
}

.tree4 {
    right: 20px;
}


/* GROUND */

.ground {

    position: absolute;

    left: 0;
    bottom: 0;

    width: 100%;
    height: 85px;

    background: #17321e;

    border-top: 8px solid #6d8b4e;
}


/* PLAYER */

#player {

    position: absolute;

    left: 50px;
    bottom: 85px;

    width: 65px;
    height: 65px;

    z-index: 10;

    transition: transform .15s;
}

#player img {

    width: 100%;
    height: 100%;

    object-fit: contain;

    border-radius: 12px;
}


/* WALKING BOB */

.walking {
    animation: walk .35s infinite alternate;
}

@keyframes walk {

    from {
        transform: translateY(0);
    }

    to {
        transform: translateY(-5px);
    }

}


/* SITTING */

.sitting {

    animation: sit .4s infinite alternate;

}

@keyframes sit {

    from {
        transform: scale(1);
    }

    to {
        transform: scale(.96);
    }

}


/* GRASS */

.grass {

    position: absolute;

    bottom: 85px;

    font-size: 45px;

    z-index: 6;

}


/* CUSHIONS */

.cushion {

    position: absolute;

    bottom: 85px;

    font-size: 50px;

    z-index: 6;

}


/* BEES */

.bee {

    position: absolute;

    font-size: 35px;

    z-index: 8;

    animation: beeFloat 1.2s infinite alternate ease-in-out;

}

@keyframes beeFloat {

    from {
        transform: translateY(0);
    }

    to {
        transform: translateY(-15px);
    }

}


/* PRINCESS */

#princess {

    position: absolute;

    right: 20px;

    bottom: 85px;

    width: 85px;
    height: 85px;

    z-index: 7;

}

#princess img {

    width: 100%;
    height: 100%;

    object-fit: contain;

    border-radius: 15px;

}


/* MESSAGE */

#message {

    display: none;

    position: absolute;

    inset: 0;

    z-index: 30;

    background:
        rgba(10,30,18,.94);

    align-items: center;

    justify-content: center;

    flex-direction: column;

    padding: 25px;

}

#message h2 {

    color: #f2dfa0;

    font-size: 38px;

}

#message p {

    font-size: 19px;

    line-height: 1.5;

}

#message button {

    padding: 13px 25px;

    border: none;

    border-radius: 25px;

    background: #c5a95d;

    color: #18291b;

    font-family: Georgia, serif;

    font-weight: bold;

    cursor: pointer;

}

.back {

    display: inline-block;

    margin-top: 15px;

    color: #e9dcae;

}

</style>

</head>


<body>


<h1>
🐈 Mr Tapus's Quest
</h1>

<p class="instructions">
Use ← → to move &nbsp; | &nbsp; SPACE to jump
</p>

<div id="score">

🐝 Bumble Bees:
<span id="beeScore">0</span>

&nbsp;&nbsp; | &nbsp;&nbsp;

🌿 Grass:
<span id="grassScore">0</span>

</div>


<div id="game">


<div class="moon">
🌙
</div>


<!-- TREES -->

<div class="tree tree1">
🌲
</div>

<div class="tree tree2">
🌳
</div>

<div class="tree tree3">
🌲
</div>

<div class="tree tree4">
🌲
</div>


<!-- MR TAPUS -->

<div id="player" class="walking">

<img
src="tapus-walking.jpg"
alt="Mr Tapus"
>

</div>


<!-- GRASS -->

<div
class="grass"
id="grass1"
style="left:240px;">

🌿

</div>


<div
class="grass"
id="grass2"
style="left:520px;">

🌿

</div>


<!-- CUSHIONS -->

<div
class="cushion"
id="cushion1"
style="left:370px;">

🛋️

</div>


<div
class="cushion"
id="cushion2"
style="left:650px;">

🛋️

</div>


<!-- BEES -->

<div
class="bee"
id="bee1"
style="left:180px; bottom:230px;">

🐝

</div>


<div
class="bee"
id="bee2"
style="left:470px; bottom:300px;">

🐝

</div>


<div
class="bee"
id="bee3"
style="left:700px; bottom:230px;">

🐝

</div>


<!-- PRINCESS -->

<div id="princess">

<img
src="princess-screaming.jpg"
alt="The Princess"
>

</div>


<div class="ground">
</div>


<!-- END SCREEN -->

<div id="message">

<h2>
👑 MR TAPUS FOUND THE PRINCESS!
</h2>

<p>
The Princess has been located.

<br><br>

Unfortunately, she has noticed him.

<br>

😱🐈💨

<br><br>

Mr Tapus collected
<span id="finalBees">0</span>
bumble bees along the way!

</p>


<button onclick="location.reload()">
Play Again
</button>

</div>


</div>


<a
class="back"
href="forest.html">

🌲 Return to the Forest

</a>


<script>


const player =
document.getElementById("player");

const game =
document.getElementById("game");

const beeScore =
document.getElementById("beeScore");

const grassScore =
document.getElementById("grassScore");

const message =
document.getElementById("message");

const finalBees =
document.getElementById("finalBees");


let x = 50;

let y = 0;

let velocityY = 0;

let jumping = false;

let bees = 0;

let grassHit = 0;

let cushionTimer = 0;

let keys = {};


const bee1 =
document.getElementById("bee1");

const bee2 =
document.getElementById("bee2");

const bee3 =
document.getElementById("bee3");


const grass1 =
document.getElementById("grass1");

const grass2 =
document.getElementById("grass2");


const cushion1 =
document.getElementById("cushion1");

const cushion2 =
document.getElementById("cushion2");


document.addEventListener(
"keydown",
function(event) {

keys[event.key] = true;


if (
event.code === "Space" &&
!jumping &&
cushionTimer <= 0
) {

velocityY = 14;

jumping = true;

}

});


document.addEventListener(
"keyup",
function(event) {

keys[event.key] = false;

});


function distanceTo(element) {

const elementX =
element.offsetLeft;

return Math.abs(
x - elementX
);

}


function collectBee(bee) {

if (
bee.style.display !== "none" &&
distanceTo(bee) < 55
) {

bee.style.display = "none";

bees++;

beeScore.innerText =
bees;

}

}


function hitGrass(grass) {

if (
grass.style.display !== "none" &&
distanceTo(grass) < 45 &&
y < 35
) {

grass.style.display = "none";

grassHit++;

grassScore.innerText =
grassHit;

velocityY = 10;

}

}


function hitCushion(cushion) {

if (
cushion.style.display !== "none" &&
distanceTo(cushion) < 55 &&
y < 30 &&
cushionTimer <= 0
) {

cushionTimer = 150;

cushion.style.opacity = ".5";

player.classList.remove("walking");

player.classList.add("sitting");

player.innerHTML = `
<img
src="tapus-sitting.jpg"
alt="Mr Tapus sitting"
>
`;

}

}


function updateCushion() {

if (cushionTimer > 0) {

cushionTimer--;

if (cushionTimer === 0) {

player.classList.remove("sitting");

player.classList.add("walking");

player.innerHTML = `
<img
src="tapus-walking.jpg"
alt="Mr Tapus"
>
`;

}

}

}


function checkPrincess() {

if (
x >
game.clientWidth - 125
) {

message.style.display =
"flex";

finalBees.innerText =
bees;

}

}


function gameLoop() {


/* DON'T MOVE WHILE COMFY */

if (cushionTimer <= 0) {

if (keys["ArrowRight"]) {

x += 5;

}

if (keys["ArrowLeft"]) {

x -= 5;

}

}


/* BOUNDARIES */

if (x < 0) {

x = 0;

}

if (
x >
game.clientWidth - 70
) {

x =
game.clientWidth - 70;

}


/* GRAVITY */

velocityY -= .7;

y += velocityY;


/* GROUND */

if (y <= 0) {

y = 0;

velocityY = 0;

jumping = false;

}


/* PLAYER */

player.style.left =
x + "px";

player.style.bottom =
(85 + y) + "px";


/* COLLECT */

collectBee(bee1);

collectBee(bee2);

collectBee(bee3);


/* GRASS */

hitGrass(grass1);

hitGrass(grass2);


/* CUSHIONS */

hitCushion(cushion1);

hitCushion(cushion2);

updateCushion();


/* PRINCESS */

checkPrincess();


requestAnimationFrame(
gameLoop
);

}


gameLoop();

</script>


</body>

</html>
