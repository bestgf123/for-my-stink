<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Mr Tapus's Mission 🐈</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Georgia, serif;
    text-align: center;
    background: #b9e5f5;
    color: #24442b;
}

h1 {
    margin: 12px 0 3px;
    color: #315c38;
    font-size: clamp(30px, 6vw, 48px);
}

.instructions {
    margin: 4px 15px 8px;
    color: #416047;
}

#hud {
    margin: 8px;
    font-weight: bold;
    color: #315c38;
}

#game {
    position: relative;
    width: 95vw;
    max-width: 950px;
    height: 520px;
    margin: auto;
    overflow: hidden;
    border: 4px solid #6d8b4e;
    border-radius: 22px;
    box-shadow: 0 12px 35px rgba(0,0,0,.25);
    background: #8ed0ee;
}


/* SKY */

.sky {
    position: absolute;
    inset: 0;
    background:
        linear-gradient(
            #7bc7ed 0%,
            #bce8f5 68%,
            #b8d98d 68%,
            #82ad61 100%
        );
}


/* SUN */

.sun {
    position: absolute;
    top: 22px;
    right: 45px;
    font-size: 65px;
    z-index: 1;
}


/* CLOUDS */

.cloud {
    position: absolute;
    font-size: 48px;
    opacity: .85;
}

.cloud1 {
    top: 55px;
    left: 100px;
}

.cloud2 {
    top: 105px;
    left: 520px;
}

.cloud3 {
    top: 35px;
    left: 750px;
}


/* BACKGROUND FLOWERS */

.flowerBush {
    position: absolute;
    bottom: 115px;
    font-size: 42px;
    white-space: nowrap;
    z-index: 2;
}

.fb1 {
    left: 60px;
}

.fb2 {
    left: 330px;
}

.fb3 {
    left: 650px;
}


/* BACKGROUND TREES */

.tree {
    position: absolute;
    bottom: 105px;
    font-size: 75px;
    z-index: 2;
}

.tree1 {
    left: 5px;
}

.tree2 {
    left: 190px;
}

.tree3 {
    left: 470px;
}

.tree4 {
    right: 5px;
}


/* WORLD */

#world {
    position: absolute;
    left: 0;
    top: 0;
    width: 4200px;
    height: 100%;
    transition: left .05s linear;
}


/* GROUND */

.ground {
    position: absolute;
    bottom: 0;
    left: 0;
    width: 4200px;
    height: 105px;
    background:
        linear-gradient(
            #72a74d 0 12px,
            #4f873d 12px 100%
        );
    z-index: 3;
}


/* PLAYER */

#player {
    position: absolute;
    width: 72px;
    height: 72px;
    z-index: 10;
}

#player img {
    width: 100%;
    height: 100%;
    object-fit: contain;
}

.walking {
    animation: bob .32s infinite alternate;
}

@keyframes bob {
    from {
        transform: translateY(0);
    }

    to {
        transform: translateY(-4px);
    }
}

.sitting {
    animation: none;
}


/* GRASS PATCHES */

.grass {
    position: absolute;
    bottom: 105px;
    width: 100px;
    height: 48px;
    z-index: 7;
    font-size: 46px;
}


/* SOFAS */

.sofa {
    position: absolute;
    bottom: 100px;
    font-size: 65px;
    z-index: 7;
}


/* BEES */

.bee {
    position: absolute;
    font-size: 34px;
    z-index: 8;
    animation: buzz 1s infinite alternate ease-in-out;
}

@keyframes buzz {

    from {
        transform: translateY(0) rotate(-4deg);
    }

    to {
        transform: translateY(-13px) rotate(4deg);
    }

}


/* PRINCESS */

#princess {
    position: absolute;
    left: 3970px;
    bottom: 105px;
    width: 110px;
    height: 110px;
    z-index: 9;
}

#princess img {
    width: 100%;
    height: 100%;
    object-fit: contain;
}


/* POPUP */

#popup {
    display: none;
    position: absolute;
    inset: 0;
    z-index: 50;
    background: rgba(255,255,255,.92);
    align-items: center;
    justify-content: center;
    flex-direction: column;
    padding: 30px;
}

#popup h2 {
    color: #315c38;
    font-size: 32px;
    max-width: 650px;
}

#popup p {
    max-width: 600px;
    line-height: 1.6;
}

#popup button {
    border: none;
    border-radius: 25px;
    padding: 13px 28px;
    background: #d5b65a;
    color: #243b27;
    font-family: Georgia, serif;
    font-weight: bold;
    cursor: pointer;
    font-size: 16px;
}


/* END SCREEN */

#ending {
    display: none;
    position: absolute;
    inset: 0;
    z-index: 60;
    background: rgba(255,255,255,.95);
    align-items: center;
    justify-content: center;
    flex-direction: column;
    padding: 25px;
}

#ending h2 {
    color: #315c38;
    font-size: 35px;
}

#ending p {
    font-size: 19px;
    line-height: 1.6;
}

#ending img {
    width: 130px;
    height: 130px;
    object-fit: contain;
}

#ending button {
    border: none;
    border-radius: 25px;
    padding: 13px 28px;
    background: #d5b65a;
    font-family: Georgia, serif;
    font-weight: bold;
    cursor: pointer;
}

.back {
    display: inline-block;
    margin: 12px;
    color: #315c38;
}


/* MOBILE */

@media (max-width: 600px) {

    #game {
        height: 470px;
    }

    .tree {
        font-size: 58px;
    }

    .flowerBush {
        font-size: 32px;
    }

}

</style>

</head>


<body>


<h1>
🐈 Mr Tapus's Mission
</h1>


<p class="instructions">
Use <b>← →</b> to move &nbsp; | &nbsp;
<b>SPACE</b> to jump
</p>


<div id="hud">
🐝 Bumble Bees: <span id="beeCount">0</span>
</div>


<div id="game">


    <div class="sky"></div>


    <div class="sun">
        ☀️
    </div>


    <div class="cloud cloud1">
        ☁️
    </div>

    <div class="cloud cloud2">
        ☁️
    </div>

    <div class="cloud cloud3">
        ☁️
    </div>


    <div id="world">


        <!-- BACKGROUND -->

        <div class="flowerBush fb1">
            🌼🌸🌷🌼
        </div>

        <div class="flowerBush fb2">
            🌸🌼🌷🌸
        </div>

        <div class="flowerBush fb3">
            🌷🌼🌸🌼
        </div>


        <div class="tree tree1">
            🌳
        </div>

        <div class="tree tree2">
            🌲
        </div>

        <div class="tree tree3">
            🌳
        </div>

        <div class="tree tree4">
            🌲
        </div>


        <!-- PLAYER -->

        <div id="player" class="walking">

            <img
                src="tapus-walking.png"
                alt="Mr Tapus"
            >

        </div>


        <!-- GRASS -->

        <div
            class="grass"
            style="left:650px;"
            data-x="650">

            🌿🌿🌿

        </div>


        <div
            class="grass"
            style="left:1250px;"
            data-x="1250">

            🌿🌿🌿

        </div>


        <div
            class="grass"
            style="left:1900px;"
            data-x="1900">

            🌿🌿🌿

        </div>


        <div
            class="grass"
            style="left:2650px;"
            data-x="2650">

            🌿🌿🌿

        </div>


        <div
            class="grass"
            style="left:3350px;"
            data-x="3350">

            🌿🌿🌿

        </div>


        <!-- SOFAS -->

        <div
            class="sofa"
            style="left:980px;"
            data-x="980">

            🛋️

        </div>


        <div
            class="sofa"
            style="left:2350px;"
            data-x="2350">

            🛋️

        </div>


        <div
            class="sofa"
            style="left:3150px;"
            data-x="3150">

            🛋️

        </div>


        <!-- BEES -->

        <div
            class="bee"
            style="left:400px; bottom:230px;"
            data-x="400">

            🐝

        </div>


        <div
            class="bee"
            style="left:780px; bottom:260px;"

        </div>


        <div
            class="bee"
            style="left:1500px; bottom:210px;"
            data-x="1500">

            🐝

        <div
            class="bee"
            style="left:2150px; bottom:275px;"

            🐝

        </div>


        <div
            class="bee"
            style="left:2850px; bottom:220px;"
            data-x="2850">

            🐝

        </div>


        <div
            class="bee"
            style="left:3650px; bottom:270px;"
            data-x="3650">

        </div>


        <!-- PRINCESS -->

        <div id="princess">

            <img
                src="princess-sitting.png"

            >

        </div>


        <div class="ground"></div>


    </div>


    <!-- POPUP -->

    <div id="popup">

        <h2 id="popupTitle"></h2>

        <p id="popupText"></p>

        <button onclick="closePopup()">
            Continue Mission
        </button>

    <!-- ENDING -->

    <div id="ending">

        <img
            id="endingImage"

        <h2>
            👑 MR TAPUS FOUND THE PRINCESS!
        </h2>

        <p>
            Mission accomplished.

            <br><br>

        <button onclick="location.reload()">
            Play Again
        </button>

    </div>


</div>


<a
    class="back"
    href="forest.html">

    🌲 Return to the Forest

</a>


<script>


const player =
document.getElementById("player");

const world =
document.getElementById("world");

const game =
document.getElementById("game");

const popup =
document.getElementById("popup");

const popupTitle =
document.getElementById("popupTitle");

const popupText =
document.getElementById("popupText");

const ending =
document.getElementById("ending");

const beeCount =
document.getElementById("beeCount");


let playerX = 80;

let playerY = 0;

let velocityY = 0;

let jumping = false;

let cameraX = 0;

let bees = 0;

let gamePaused = false;

let keys = {};


const grass =
document.querySelectorAll(".grass");

const sofas =
document.querySelectorAll(".sofa");

const beeElements =
document.querySelectorAll(".bee");


document.addEventListener(
    "keydown",
    function(event) {

        keys[event.key] = true;

        if (
            event.code === "Space" &&
            !jumping &&
            !gamePaused
        ) {

            velocityY = 14;

            jumping = true;

        }

    }
);


document.addEventListener(
    "keyup",
    function(event) {

        keys[event.key] = false;

    }
);


function showPopup(title, text) {

    gamePaused = true;

    popupTitle.innerText = title;

    popupText.innerText = text;

    popup.style.display = "flex";

}


function closePopup() {

    popup.style.display = "none";

    gamePaused = false;

}


function distanceFrom(element) {

    const obstacleX =
        parseInt(element.dataset.x);

    return Math.abs(
        playerX - obstacleX
    );

}


/* GRASS */

function checkGrass() {

    grass.forEach(function(item) {

        if (
            distanceFrom(item) < 65 &&
            playerY < 35
        ) {

            if (
                playerX <
                parseInt(item.dataset.x)
            ) {

                playerX =
                    parseInt(item.dataset.x) - 70;

                showPopup(
                    "🌿 Oh no!",
                    "Mr Tapus has encountered a patch of grass! He must jump over it if he wants to continue his mission."
                );

            }

        }

    });

}


/* SOFAS */

function checkSofas() {

    sofas.forEach(function(item) {

        if (
            distanceFrom(item) < 65 &&
            playerY < 40
        ) {

            playerX =
                parseInt(item.dataset.x) - 70;

            gamePaused = true;

            player.classList.remove("walking");

            player.classList.add("sitting");

            player.innerHTML = `
                <img
                    src="tapus-sitting.png"
                    alt="Mr Tapus sitting"
                >
            `;

            popupTitle.innerText =
                "🛋️ Mission Failed!";

            popupText.innerText =
                "Mr Tapus has found a cozy lil nook and got distracted, he failed his mission.";

            popup.style.display =
                "flex";

            popup.querySelector("button").innerText =
                "Try Again";

            popup.querySelector("button").onclick =
                function() {

                    location.reload();

                };

        }

    });

}


/* BEES */

function checkBees() {

    beeElements.forEach(function(bee) {

        if (
            bee.style.display !== "none" &&
            distanceFrom(bee) < 60 &&
            Math.abs(
                playerY -
                (parseInt(bee.style.bottom) - 105)
            ) < 80
        ) {

            bee.style.display =
                "none";

            bees++;

            beeCount.innerText =
                bees;

        }

    });

}


/* CAMERA */

function updateCamera() {

    const desiredCamera =
        playerX - game.clientWidth * .35;

    cameraX =
        Math.max(
            0,
            Math.min(
                desiredCamera,
                4200 - game.clientWidth
            )
        );

    world.style.left =
        -cameraX + "px";

}


/* END */

function checkPrincess() {

    if (playerX > 3890) {

        gamePaused = true;

        ending.style.display =
            "flex";

    }

}


/* GAME LOOP */

function gameLoop() {

    if (!gamePaused) {


        /* MOVEMENT */

        if (keys["ArrowRight"]) {

            playerX += 5;

        }


        if (keys["ArrowLeft"]) {

            playerX -= 5;

        }


        /* BOUNDARIES */

        if (playerX < 0) {

            playerX = 0;

        }


        if (playerX > 4050) {

            playerX = 4050;

        }


        /* GRAVITY */

        velocityY -= .7;

        playerY += velocityY;


        /* GROUND */

        if (playerY <= 0) {

            playerY = 0;

            velocityY = 0;

            jumping = false;

        }


        /* PLAYER POSITION */

        player.style.left =
            playerX + "px";

        player.style.bottom =
            (105 + playerY) + "px";


        checkGrass();

        checkSofas();

        checkBees();

        checkPrincess();

        updateCamera();

    }


    requestAnimationFrame(
        gameLoop
    );

}


gameLoop();

</script>


</body>

</html>
