<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Mr Tapus's Mission 🐈</title>


<style>

/* =========================
   GENERAL
========================= */

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Georgia, serif;
    text-align: center;
    background: #b9e5f5;
    color: #24442b;
}

h1 {
    margin: 12px 0 3px;
    color: #315c38;
    font-size: clamp(30px, 6vw, 48px);
}

.instructions {
    margin: 4px 15px 8px;
    color: #416047;
}

#hud {
    margin: 8px;
    font-weight: bold;
    color: #315c38;
}


/* =========================
   GAME WINDOW
========================= */

#game {
    position: relative;
    width: 95vw;
    max-width: 950px;
    height: 520px;
    margin: auto;
    overflow: hidden;

    border: 4px solid #6d8b4e;
    border-radius: 22px;

    box-shadow:
        0 12px 35px rgba(0,0,0,.25);

    background: #8ed0ee;
}


/* =========================
   SKY
========================= */

.sky {
    position: absolute;
    inset: 0;

    background:
        linear-gradient(
            #72c4eb 0%,
            #c8edf7 68%,
            #b8d98d 68%,
            #82ad61 100%
        );
}


/* SUN */

.sun {
    position: absolute;
    top: 18px;
    right: 45px;
    font-size: 70px;
    z-index: 1;
}


/* CLOUDS */

.cloud {
    position: absolute;
    font-size: 48px;
    opacity: .85;
}

.cloud1 {
    top: 55px;
    left: 100px;
}

.cloud2 {
    top: 105px;
    left: 520px;
}

.cloud3 {
    top: 35px;
    left: 750px;
}


/* =========================
   WORLD
========================= */

#world {
    position: absolute;
    left: 0;
    top: 0;

    width: 5000px;
    height: 100%;
}


/* =========================
   WILDFLOWERS
========================= */

.flowerBush {
    position: absolute;

    bottom: 115px;

    font-size: 45px;

    white-space: nowrap;

    z-index: 2;
}

.fb1 { left: 70px; }
.fb2 { left: 500px; }
.fb3 { left: 1100px; }
.fb4 { left: 1750px; }
.fb5 { left: 2450px; }
.fb6 { left: 3200px; }
.fb7 { left: 3900px; }


/* =========================
   TREES
========================= */

.tree {
    position: absolute;

    bottom: 105px;

    font-size: 78px;

    z-index: 2;
}

.tree1 { left: 0; }
.tree2 { left: 350px; }
.tree3 { left: 850px; }
.tree4 { left: 1450px; }
.tree5 { left: 2100px; }
.tree6 { left: 2800px; }
.tree7 { left: 3500px; }
.tree8 { left: 4300px; }


/* =========================
   GROUND
========================= */

.ground {
    position: absolute;

    left: 0;
    bottom: 0;

    width: 5000px;
    height: 105px;

    background:
        linear-gradient(
            #72a74d 0 12px,
            #4f873d 12px 100%
        );

    z-index: 3;
}


/* =========================
   MR TAPUS
========================= */

#player {

    position: absolute;

    width: 130px;
    height: 130px;

    z-index: 10;
}


#player img {

    width: 100%;
    height: 100%;

    object-fit: contain;
}


/* WALKING */

.walking {

    animation:
        bob .32s infinite alternate;
}


@keyframes bob {

    from {
        transform:
            translateY(0);
    }

    to {
        transform:
            translateY(-5px);
    }
}


/* SITTING */

.sitting {
    animation: none;
}


/* =========================
   CUSTOM GRASS
========================= */

.grass {

    position: absolute;

    bottom: 105px;

    width: 120px;
    height: 65px;

    z-index: 7;
}


/* Main grass mound */

.grass::before {

    content: "";

    position: absolute;

    left: 8px;
    bottom: 0;

    width: 105px;
    height: 28px;

    background: #4f873d;

    border-radius:
        55% 55% 20% 20%;

}


/* Grass blades */

.grass::after {

    content:
        "⌁ ︵ ⌁ ︵ ⌁ ︵ ⌁";

    position: absolute;

    left: 0;
    bottom: 12px;

    width: 120px;

    font-size: 30px;

    font-weight: bold;

    color: #356b35;

    letter-spacing: -5px;

    transform:
        rotate(-2deg);
}


/* =========================
   SOFAS
========================= */

.sofa {

    position: absolute;

    bottom: 98px;

    font-size: 70px;

    z-index: 7;
}


/* =========================
   BEES
========================= */

.bee {

    position: absolute;

    font-size: 36px;

    z-index: 8;

    animation:
        buzz 1s infinite alternate ease-in-out;
}


@keyframes buzz {

    from {

        transform:
            translateY(0)
            rotate(-4deg);

    }

    to {

        transform:
            translateY(-14px)
            rotate(4deg);

    }

}


/* =========================
   PRINCESS
========================= */

#princess {

    position: absolute;

    left: 4770px;

    bottom: 105px;

    width: 180px;
    height: 180px;

    z-index: 9;
}


#princess img {

    width: 100%;
    height: 100%;

    object-fit: contain;
}


/* =========================
   POPUP
========================= */

#popup {

    display: none;

    position: absolute;

    inset: 0;

    z-index: 50;

    background:
        rgba(255,255,255,.94);

    align-items: center;

    justify-content: center;

    flex-direction: column;

    padding: 30px;
}


#popup h2 {

    color: #315c38;

    font-size: 32px;

    max-width: 650px;
}


#popup p {

    max-width: 600px;

    line-height: 1.6;

    font-size: 18px;
}


.popupButtons {

    display: flex;

    gap: 12px;

    flex-wrap: wrap;

    justify-content: center;
}


#popup button {

    border: none;

    border-radius: 25px;

    padding: 13px 25px;

    background: #d5b65a;

    color: #243b27;

    font-family: Georgia, serif;

    font-weight: bold;

    cursor: pointer;

    font-size: 16px;
}


/* =========================
   ENDING
========================= */

#ending {

    display: none;

    position: absolute;

    inset: 0;

    z-index: 60;

    background:
        rgba(255,255,255,.96);

    align-items: center;

    justify-content: center;

    flex-direction: column;

    padding: 25px;
}


#ending h2 {

    color: #315c38;

    font-size: 35px;
}


#ending p {

    font-size: 19px;

    line-height: 1.6;
}


#ending img {

    width: 180px;
    height: 180px;

    object-fit: contain;
}


#ending button {

    border: none;

    border-radius: 25px;

    padding: 13px 28px;

    background: #d5b65a;

    font-family: Georgia, serif;

    font-weight: bold;

    cursor: pointer;
}


/* BACK LINK */

.back {

    display: inline-block;

    margin: 12px;

    color: #315c38;
}


/* MOBILE */

@media (max-width: 600px) {

    #game {
        height: 470px;
    }

    .tree {
        font-size: 58px;
    }

    .flowerBush {
        font-size: 32px;
    }

}

</style>

</head>

<script>


/* =========================
   ELEMENTS
========================= */


const player =
document.getElementById("player");

const world =
document.getElementById("world");

const game =
document.getElementById("game");

const popup =
document.getElementById("popup");

const popupTitle =
document.getElementById("popupTitle");

const popupText =
document.getElementById("popupText");

const mainButton =
document.getElementById("mainButton");

const beeButton =
document.getElementById("beeButton");

const ending =
document.getElementById("ending");

const beeCount =
document.getElementById("beeCount");


/* =========================
   GAME VARIABLES
========================= */


let playerX = 100;

let playerY = 0;

let velocityY = 0;

let jumping = false;

let cameraX = 0;

let bees = 0;

let gamePaused = false;

let popupType = "";

let keys = {};


const grass =
document.querySelectorAll(".grass");

const sofas =
document.querySelectorAll(".sofa");

const beeElements =
document.querySelectorAll(".bee");


/* =========================
   CONTROLS
========================= */


document.addEventListener(
"keydown",
function(event) {


keys[event.key] = true;


if (

event.key === "ArrowUp" &&

!jumping &&

!gamePaused

) {


velocityY = 15;

jumping = true;


}

});


document.addEventListener(
"keyup",
function(event) {

keys[event.key] = false;

});


/* =========================
   POPUP
========================= */


function showPopup(
title,
text,
type
) {


gamePaused = true;

popupType = type;


popupTitle.innerText =
title;

popupText.innerText =
text;


popup.style.display =
"flex";


if (type === "grass") {


mainButton.innerText =
"🐈 Get up, Tapus!";

beeButton.style.display =
"none";


}


if (type === "sofa") {


mainButton.innerText =
"Give up 😭";


beeButton.style.display =

bees > 0
? "inline-block"
: "none";


}

}


/* =========================
   POPUP ACTION
========================= */


function popupAction() {


if (popupType === "grass") {


player.classList.remove(
"sitting"
);

player.classList.add(
"walking"
);


player.innerHTML = `

<img
src="tapus-walking.png"
alt="Mr Tapus">

`;


closePopup();


}


else if (popupType === "sofa") {


location.reload();


}


}


/* =========================
   CLOSE POPUP
========================= */


function closePopup() {


popup.style.display =
"none";


gamePaused = false;

popupType = "";


}


/* =========================
   USE BEE
========================= */


function useBee() {


if (bees <= 0) {

return;

}


bees--;


beeCount.innerText =
bees;


popup.style.display =
"none";


gamePaused = false;


player.classList.remove(
"sitting"
);

player.classList.add(
"walking"
);


player.innerHTML = `

<img
src="tapus-walking.png"
alt="Mr Tapus">

`;


}


/* =========================
   DISTANCE
========================= */


function distanceFrom(element) {


const obstacleX =
parseInt(
element.dataset.x
);


return Math.abs(
playerX - obstacleX
);


}


/* =========================
   GRASS
========================= */


function checkGrass() {


grass.forEach(
function(item) {


if (

distanceFrom(item) < 90 &&

playerY < 50

) {


playerX =
parseInt(
item.dataset.x
) - 100;


player.classList.remove(
"walking"
);

player.classList.add(
"sitting"
);


player.innerHTML = `

<img
src="tapus-sitting.png"
alt="Mr Tapus sitting">

`;


showPopup(

"🌿 Oh no!",

"Mr Tapus has encountered a patch of grass! He's stopped for a little sit-down. He'll have to get himself together if he wants to continue his mission.",

"grass"

);


}

});


}


/* =========================
   SOFAS
========================= */


function checkSofas() {


sofas.forEach(
function(item) {


if (

distanceFrom(item) < 95 &&

playerY < 55

) {


playerX =
parseInt(
item.dataset.x
) - 100;


player.classList.remove(
"walking"
);

player.classList.add(
"sitting"
);


player.innerHTML = `

<img
src="tapus-sitting.png"
alt="Mr Tapus sitting">

`;


showPopup(

"🛋️ Cozy lil nook detected!",

"Mr Tapus has found a cozy lil nook and got distracted. He failed his mission.",

"sofa"

);


}

});


}


/* =========================
   BEES
========================= */


function checkBees() {


beeElements.forEach(
function(bee) {


if (

bee.style.display !== "none" &&

distanceFrom(bee) < 75 &&

Math.abs(

playerY -

(
parseInt(
bee.style.bottom
) - 105
)

) < 100

) {


bee.style.display =
"none";


bees++;


beeCount.innerText =
bees;


}

});


}


/* =========================
   CAMERA
========================= */


function updateCamera() {


const desiredCamera =

playerX -
game.clientWidth * .35;


cameraX =

Math.max(

0,

Math.min(

desiredCamera,

5000 -
game.clientWidth

)

);


world.style.left =

-cameraX + "px";


}


/* =========================
   PRINCESS
========================= */


function checkPrincess() {


if (playerX > 4650) {


gamePaused = true;


ending.style.display =
"flex";


}

}


/* =========================
   GAME LOOP
========================= */


function gameLoop() {


if (!gamePaused) {


/* MOVE RIGHT */

if (
keys["ArrowRight"]
) {

playerX += 4;

}


/* MOVE LEFT */

if (
keys["ArrowLeft"]
) {

playerX -= 4;

}


/* LIMIT */

if (playerX < 0) {

playerX = 0;

}


if (playerX > 4850) {

playerX = 4850;

}


/* GRAVITY */

velocityY -= .7;

playerY += velocityY;


/* GROUND */

if (playerY <= 0) {

playerY = 0;

velocityY = 0;

jumping = false;

}


/* PLAYER POSITION */

player.style.left =
playerX + "px";


player.style.bottom =
(105 + playerY) + "px";


/* CHECK OBJECTS */

checkGrass();

checkSofas();

checkBees();

checkPrincess();


/* CAMERA */

updateCamera();


}


requestAnimationFrame(
gameLoop
);


}


/* START */

gameLoop();


</script>
