<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>The Birthday Quest 🎮</title>

<style>

* {
    box-sizing: border-box;
}

body {

    margin: 0;

    background: #102719;

    font-family: Georgia, serif;

    color: #f5edd5;

    text-align: center;

    overflow: hidden;

}

h1 {

    margin: 15px 0 5px;

    color: #f2dfa0;

}

.instructions {

    margin: 5px 0 15px;

    color: #d5ceb7;

}

#game {

    position: relative;

    width: 95vw;

    max-width: 900px;

    height: 500px;

    margin: auto;

    overflow: hidden;

    border: 4px solid #8e7547;

    border-radius: 20px;

    background:

        linear-gradient(
            #244b35 0%,
            #3f6844 60%,
            #1b3824 60%,
            #1b3824 100%
        );

    box-shadow:
        0 15px 40px rgba(0,0,0,.5);

}


/* MOON */

.moon {

    position: absolute;

    top: 25px;

    right: 40px;

    font-size: 55px;

}


/* TREES */

.tree {

    position: absolute;

    font-size: 60px;

    bottom: 100px;

}

.tree1 {
    left: 40px;
}

.tree2 {
    left: 300px;
}

.tree3 {
    right: 180px;
}

.tree4 {
    right: 30px;
}


/* GROUND */

.ground {

    position: absolute;

    left: 0;

    bottom: 0;

    width: 100%;

    height: 100px;

    background: #193622;

    border-top: 8px solid #6d8b4e;

}


/* PLAYER */

#player {

    position: absolute;

    left: 70px;

    bottom: 100px;

    font-size: 48px;

    width: 55px;

    height: 55px;

}


/* STAR */

.star {

    position: absolute;

    font-size: 35px;

}


/* OBSTACLE */

.obstacle {

    position: absolute;

    bottom: 100px;

    font-size: 42px;

}


/* FINISH */

.finish {

    position: absolute;

    right: 25px;

    bottom: 100px;

    font-size: 55px;

}


/* MESSAGE */

#message {

    display: none;

    position: absolute;

    inset: 0;

    background: rgba(10,30,18,.88);

    align-items: center;

    justify-content: center;

    flex-direction: column;

    z-index: 20;

}

#message h2 {

    font-size: 42px;

    color: #f2dfa0;

}

#message p {

    font-size: 20px;

}

#message button {

    padding: 12px 25px;

    border: none;

    border-radius: 25px;

    background: #c5a95d;

    color: #18291b;

    font-family: Georgia, serif;

    font-weight: bold;

    cursor: pointer;

}

.back {

    display: inline-block;

    margin-top: 15px;

    color: #e9dcae;

}


</style>

</head>


<body>


<h1>
    🎮 The Birthday Quest
</h1>

<p class="instructions">
    Use ← → to move and SPACE to jump!
</p>


<div id="game">


    <div class="moon">
        🌙
    </div>


    <div class="tree tree1">
        🌲
    </div>

    <div class="tree tree2">
        🌳
    </div>

    <div class="tree tree3">
        🌲
    </div>

    <div class="tree tree4">
        🌲
    </div>


    <div id="player">
        🐈
    </div>


    <div
        class="star"
        style="left: 300px; bottom: 190px;">
        ⭐
    </div>


    <div
        class="star"
        style="left: 520px; bottom: 260px;">
        ⭐
    </div>


    <div
        class="star"
        style="left: 680px; bottom: 180px;">
        ⭐
    </div>


    <div
        class="obstacle"
        style="left: 430px;">
        🍄
    </div>


    <div class="finish">
        🎁
    </div>


    <div class="ground">
    </div>


    <div id="message">

        <h2>
            🎉 You found the birthday treasure!
        </h2>

        <p>
            Happy Birthday, Stink! ❤️
        </p>

        <button onclick="location.reload()">
            Play Again
        </button>

    </div>


</div>


<a
    class="back"
    href="forest.html">

    🌲 Return to the Forest

</a>


<script>

const player =
    document.getElementById("player");

const game =
    document.getElementById("game");

const message =
    document.getElementById("message");


let x = 70;

let y = 0;

let velocityY = 0;

let jumping = false;

let keys = {};


document.addEventListener("keydown", function(e) {

    keys[e.key] = true;

    if (
        e.code === "Space" &&
        !jumping
    ) {

        velocityY = 14;

        jumping = true;

    }

});


document.addEventListener("keyup", function(e) {

    keys[e.key] = false;

});


function gameLoop() {


    /* MOVEMENT */

    if (keys["ArrowRight"]) {

        x += 5;

    }

    if (keys["ArrowLeft"]) {

        x -= 5;

    }


    /* KEEP PLAYER INSIDE */

    if (x < 0) {

        x = 0;

    }

    if (x > game.clientWidth - 55) {

        x = game.clientWidth - 55;

    }


    /* GRAVITY */

    velocityY -= .7;

    y += velocityY;


    if (y <= 0) {

        y = 0;

        velocityY = 0;

        jumping = false;

    }


    player.style.left = x + "px";

    player.style.bottom =
        (100 + y) + "px";


    /* FINISH */

    if (x >
        game.clientWidth - 100) {

        message.style.display = "flex";

    }


    requestAnimationFrame(gameLoop);

}


gameLoop();

</script>


</body>

</html>
